<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benzola — Every Time</title>
  <meta name="description" content="Benzola · cinematic dark bio & music" />
  <meta property="og:title" content="Benzola — Every Time" />
  <meta property="og:description" content="вечность пахнет дымом и снегом" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #050505;
      --bg: #0a0a0b;
      --surface: #111113;
      --border: rgba(255,255,255,0.08);
      --text: #e8e6e3;
      --text-dim: #8a8782;
      --text-ghost: #5c5955;
      --blood: #8b1a1a;
      --blood-bright: #c41e1e;
      --blood-glow: #ff2a2a;
      --bone: #d4cfc7;
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Manrope", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--void); }
    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }

    @keyframes breathe {
      0%, 100% { transform: scale(1.03); }
      50% { transform: scale(1.08); }
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(-3%, 2%, 0); opacity: 0.15; }
      50% { transform: translate3d(5%, -4%, 0); opacity: 0.28; }
    }
    @keyframes rain {
      from { background-position: 0 -120vh; }
      to { background-position: 22px 120vh; }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.25; filter: blur(18px); transform: scale(1); }
      50% { opacity: 0.55; filter: blur(10px); transform: scale(1.15); }
    }
    @keyframes lyric-in {
      0% { opacity: 0; transform: translateY(28px) scale(0.94); filter: blur(12px); }
      60% { opacity: 1; filter: blur(0); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes slash {
      0%, 72%, 100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
      76% { clip-path: inset(38% 0 42% 0); transform: translateX(-6px); }
      80% { clip-path: inset(8% 0 65% 0); transform: translateX(7px); }
      86% { clip-path: inset(70% 0 8% 0); transform: translateX(-3px); }
    }
    @keyframes wave {
      0%, 100% { height: 14%; }
      50% { height: var(--bar); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float-soft {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(-4deg); }
    }
    @keyframes blood-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(196, 30, 30, 0); }
      50% { box-shadow: 0 0 28px 4px rgba(196, 30, 30, 0.35); }
    }
    @keyframes name-glow {
      0%, 100% { text-shadow: 0 0 20px rgba(196,30,30,0.15), 0 4px 40px rgba(0,0,0,0.8); }
      50% { text-shadow: 0 0 36px rgba(196,30,30,0.35), 0 4px 40px rgba(0,0,0,0.8); }
    }
    @keyframes particle {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-100vh) scale(0.4); opacity: 0; }
    }
    @keyframes sigil-breathe {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 20px 56px;
      isolation: isolate;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: var(--void);
      overflow: hidden;
      pointer-events: none;
    }
    .scene > * { position: absolute; inset: 0; width: 100%; height: 100%; }

    .layer-forest {
      object-fit: cover;
      opacity: 0.42;
      filter: grayscale(1) contrast(1.5) brightness(0.32) saturate(0.3);
      animation: breathe 22s ease-in-out infinite;
      transform-origin: center 40%;
    }
    .layer-tree {
      object-fit: cover;
      opacity: 0.18;
      mix-blend-mode: screen;
      filter: grayscale(0.3) saturate(0.7) contrast(1.4) brightness(0.55);
      clip-path: polygon(42% 0, 100% 0, 100% 68%, 58% 58%);
      mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
      -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
    }
    .layer-river {
      object-fit: cover;
      opacity: 0.22;
      mix-blend-mode: screen;
      filter: grayscale(0.75) contrast(1.8) brightness(0.4) hue-rotate(-8deg);
      clip-path: polygon(0 52%, 42% 58%, 55% 100%, 0 100%);
      mask-image: linear-gradient(to top, black 30%, transparent 90%);
      -webkit-mask-image: linear-gradient(to top, black 30%, transparent 90%);
    }
    .layer-fangs {
      width: min(42vw, 520px);
      height: min(42vw, 520px);
      inset: auto -2vw -8vw auto;
      object-fit: cover;
      opacity: 0.28;
      mix-blend-mode: screen;
      filter: contrast(1.6) brightness(0.85) sepia(0.08);
      border-radius: 50%;
      transform: rotate(-8deg);
      -webkit-mask-image: radial-gradient(circle at 50% 45%, black 32%, transparent 72%);
      mask-image: radial-gradient(circle at 50% 45%, black 32%, transparent 72%);
      animation: float-soft 14s ease-in-out infinite;
    }
    .vignette {
      background:
        radial-gradient(ellipse 80% 70% at 50% 40%, transparent 0%, transparent 25%, rgba(5,5,5,0.5) 60%, var(--void) 100%),
        linear-gradient(180deg, rgba(139,26,26,0.12) 0%, transparent 22%, transparent 70%, var(--void) 100%);
    }
    .mist {
      inset: auto -25% 8%;
      height: 28%;
      background: radial-gradient(ellipse, rgba(212,207,199,0.22), transparent 65%);
      filter: blur(32px);
      animation: drift 13s ease-in-out infinite;
    }
    .mist-2 {
      bottom: 38%;
      height: 18%;
      opacity: 0.1;
      animation-delay: -7s;
      animation-duration: 18s;
    }
    .blood-rain {
      opacity: 0.1;
      background-image: repeating-linear-gradient(
        95deg,
        transparent 0 52px,
        rgba(196,30,30,0.65) 53px 54px,
        transparent 55px 98px
      );
      background-size: 120px 180vh;
      transform: rotate(8deg) scale(1.25);
      animation: rain 9s linear infinite;
    }
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particles span {
      position: absolute;
      bottom: -10px;
      width: 2px;
      height: 2px;
      background: rgba(196,30,30,0.5);
      border-radius: 50%;
      animation: particle linear infinite;
    }

    .shell {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      position: relative;
      animation: fade-up 1.2s ease-out both;
    }
    .sigil {
      display: block;
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--blood-bright);
      line-height: 1;
      margin-bottom: 6px;
      animation: sigil-breathe 4s ease-in-out infinite;
      text-shadow: 0 0 24px rgba(196,30,30,0.45);
    }
    .eyebrow {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.48em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .name {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(52px, 13vw, 86px);
      line-height: 0.85;
      letter-spacing: 0.04em;
      color: var(--bone);
      animation: name-glow 5s ease-in-out infinite;
    }
    .name em {
      display: block;
      font-style: italic;
      font-weight: 300;
      color: transparent;
      -webkit-text-stroke: 1px rgba(212,207,199,0.45);
      letter-spacing: 0.12em;
      margin-top: 2px;
    }
    .motto {
      margin-top: 16px;
      font-family: var(--font-display);
      font-size: 15px;
      font-style: italic;
      color: rgba(212,207,199,0.55);
      letter-spacing: 0.02em;
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      animation: fade-up 1.2s 0.15s ease-out both;
    }
    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(22,22,24,0.85), rgba(17,17,19,0.7));
      color: var(--text);
      text-decoration: none;
      backdrop-filter: blur(16px);
      overflow: hidden;
      transition: border-color 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
    }
    .link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(196,30,30,0.12), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .link:hover {
      border-color: rgba(196,30,30,0.45);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 24px rgba(196,30,30,0.12);
    }
    .link:hover::before { opacity: 1; }
    .link-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .link-num {
      font-size: 9px;
      font-weight: 500;
      color: var(--blood-bright);
      letter-spacing: 0.08em;
    }
    .link-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .link svg {
      width: 15px;
      height: 15px;
      opacity: 0.45;
      transition: opacity 0.3s, transform 0.3s;
      position: relative;
      z-index: 1;
    }
    .link:hover svg {
      opacity: 0.9;
      transform: translate(2px, -2px);
    }

    .player {
      width: 100%;
      position: relative;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: linear-gradient(165deg, rgba(14,14,16,0.92), rgba(10,10,12,0.88));
      box-shadow: 0 24px 60px rgba(0,0,0,0.65), inset 0 1px rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      overflow: hidden;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
      animation: fade-up 1.2s 0.28s ease-out both;
    }
    .player.is-playing {
      border-color: rgba(196,30,30,0.35);
      box-shadow: 0 24px 60px rgba(0,0,0,0.65), 0 0 40px rgba(196,30,30,0.08), inset 0 1px rgba(255,255,255,0.04);
    }
    .player-glow {
      position: absolute;
      top: -6px;
      left: 18%;
      width: 64%;
      height: 10px;
      border-radius: 50%;
      background: var(--blood-bright);
      opacity: 0.2;
      filter: blur(12px);
      pointer-events: none;
    }
    .player.is-playing .player-glow {
      animation: pulse-glow 2.4s ease-in-out infinite;
    }

    .player-top {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 12px 8px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(212,207,199,0.35);
      background: var(--bone);
      color: var(--void);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }
    .play-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 28px rgba(196,30,30,0.35);
    }
    .player.is-playing .play-btn {
      animation: blood-pulse 2.6s ease-in-out infinite;
    }
    .play-btn svg { width: 18px; height: 18px; }
    .play-offset { transform: translateX(1.5px); }

    .track-meta {
      min-width: 0;
      display: grid;
      gap: 6px;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .track-title {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .track-title svg {
      width: 12px;
      height: 12px;
      color: var(--blood-bright);
      flex-shrink: 0;
    }
    .track-title strong {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 400;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spotify {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-ghost);
      text-decoration: none;
      transition: color 0.25s;
      flex-shrink: 0;
    }
    .spotify:hover { color: var(--bone); }
    .spotify svg { width: 10px; height: 10px; }

    .seek {
      --progress: 0%;
      width: 100%;
      height: 3px;
      appearance: none;
      border-radius: 3px;
      background: linear-gradient(to right, var(--blood-bright) var(--progress), rgba(255,255,255,0.1) var(--progress));
      cursor: pointer;
    }
    .seek::-webkit-slider-thumb {
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 14px rgba(196,30,30,0.5);
      cursor: pointer;
    }
    .seek::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: none;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 14px rgba(196,30,30,0.5);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
    }
    .time-row time {
      font-size: 9px;
      color: var(--text-ghost);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .vol {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 4px;
    }
    .vol svg {
      width: 14px;
      height: 14px;
      color: var(--text-ghost);
    }
    .vol input {
      width: 52px;
      accent-color: var(--blood-bright);
      cursor: pointer;
    }

    .lyrics-wrap {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.85s cubic-bezier(0.22, 0.8, 0.22, 1), opacity 0.45s ease;
    }
    .player.is-playing .lyrics-wrap {
      max-height: 240px;
      opacity: 1;
    }

    .lyric-stage {
      height: 168px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 14px 16px 6px;
      overflow: hidden;
    }
    .lyric-active {
      margin: 6px 0;
      max-width: 100%;
      font-family: var(--font-display);
      font-size: clamp(22px, 5.8vw, 34px);
      font-style: italic;
      font-weight: 300;
      line-height: 1.05;
      color: var(--bone);
      text-shadow: 0 0 28px rgba(196,30,30,0.4);
      animation: lyric-in 0.65s cubic-bezier(0.2, 0.85, 0.2, 1) both;
    }
    .lyric-ghost {
      margin: 0;
      max-width: 92%;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-ghost);
      opacity: 0.5;
    }
    .lyric-cut {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 14px 16px;
      pointer-events: none;
      font-family: var(--font-display);
      font-size: clamp(22px, 5.8vw, 34px);
      font-style: italic;
      color: var(--blood-glow);
      opacity: 0.55;
      animation: slash 4.8s steps(1) infinite;
    }

    .waveform {
      height: 28px;
      display: flex;
      align-items: center;
      gap: 2.5px;
      padding: 0 16px 14px;
      opacity: 0.45;
    }
    .waveform i {
      display: block;
      flex: 1;
      height: 12%;
      min-width: 2px;
      border-radius: 3px;
      background: linear-gradient(to top, var(--blood-bright), var(--bone));
    }
    .player.is-playing .waveform i {
      animation: wave 0.7s ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .footer {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 8px;
      letter-spacing: 0.32em;
      color: rgba(212,207,199,0.28);
      z-index: 2;
    }

    @media (max-width: 520px) {
      .page {
        padding: 32px 14px 48px;
        place-items: start center;
        overflow-y: auto;
      }
      .name { font-size: 56px; }
      .layer-fangs {
        width: 78vw;
        height: 78vw;
        opacity: 0.22;
      }
      .vol { display: none; }
      .player-top { grid-template-columns: 48px 1fr; }
      .links { gap: 8px; }
      .link { height: 50px; padding: 0 14px; border-radius: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="scene" aria-hidden="true">
      <img class="layer-forest" src="black-forest.png" alt="" />
      <img class="layer-tree" src="crimson-tree.webp" alt="" />
      <img class="layer-river" src="winter-river.png" alt="" />
      <img class="layer-fangs" src="fangs.webp" alt="" />
      <div class="vignette"></div>
      <div class="mist"></div>
      <div class="mist mist-2"></div>
      <div class="blood-rain"></div>
      <div class="particles" id="particles"></div>
    </div>

    <div class="shell">
      <header class="brand">
        <span class="sigil">†</span>
        <p class="eyebrow">fallen · beloved · eternal</p>
        <h1 class="name">BENZOLA<em>Every Time</em></h1>
        <p class="motto">вечность пахнет дымом и снегом</p>
      </header>

      <nav class="links" aria-label="Links">
        <a class="link" href="https://www.tiktok.com/@kelli2458?_r=1&_t=ZG-99a2X7MxjEW" target="_blank" rel="noreferrer">
          <span class="link-inner">

          </span>

        <a class="link" href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer">

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </nav>

      <section class="player" id="player" aria-label="Music player">
        <div class="player-glow"></div>
        <audio id="audio" src="Every-Time.mp3" preload="metadata"></audio>

        <div class="player-top">
          <button class="play-btn" id="playBtn" aria-label="Play">
            <svg id="iconPlay" class="play-offset" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="iconPause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>

          <div class="track-meta">
            <div class="track-row">
              <div class="track-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <strong>Every Time</strong>
              </div>
              <a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">
                Spotify
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
            <input class="seek" id="seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="Position" />
            <div class="time-row">
              <time id="tCurrent">0:00</time>
              <time id="tDuration">0:00</time>
            </div>
          </div>

          <div class="vol">
            <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="0.85" aria-label="Volume" />
          </div>
        </div>

        <div class="lyrics-wrap">
          <div class="lyric-stage" aria-live="polite">
            <p class="lyric-ghost" id="lBefore"></p>
            <p class="lyric-active" id="lActive"></p>
            <p class="lyric-ghost" id="lAfter"></p>
            <div class="lyric-cut" id="lCut" aria-hidden="true"></div>
          </div>
          <div class="waveform" id="waveform" aria-hidden="true"></div>
        </div>
      </section>
    </div>

    <p class="footer">BENZOLA · IX · MMXXVI</p>
  </main>

  <script>
    /* Timed lyrics in seconds — tighter sync with the track */
    const timedLyrics = [
      { t: 0.0,  text: "…" },
      { t: 3.8,  text: "Мне крутит голову" },
      { t: 7.2,  text: "Прокуренный быт" },
      { t: 10.4, text: "Ком лезет из горла" },
      { t: 13.6, text: "Я твой невроз" },
      { t: 16.5, text: "Социальная травма" },
      { t: 19.8, text: "Удары, порезы без повода" },
      { t: 24.0, text: "Мутная грязь — среда обитания" },
      { t: 28.2, text: "Нам с тобою комфортная" },
      { t: 31.8, text: "Память насилует мозг" },
      { t: 35.2, text: "Я снова даю дешевое слово" },
      { t: 39.4, text: "Мертвое тело — сгнившее нутро" },
      { t: 43.6, text: "Меня тянет на панельный" },
      { t: 46.8, text: "Или тянет на притон" },
      { t: 50.2, text: "Я шагаю, шагаю, шагаю" },
      { t: 53.6, text: "Хуй пойми на чем" },
      { t: 56.8, text: "Может быть о лучшей жизни" },
      { t: 60.4, text: "Завтра мне приснится сон" },
      { t: 64.0, text: "О мой бог курит боль" },
      { t: 67.4, text: "И колется ночами" },
      { t: 70.6, text: "Кремируй вечный покой" },
      { t: 74.0, text: "Ведь счастье за горами" },
      { t: 77.6, text: "Моя муза блюет" },
      { t: 80.6, text: "Кровавыми кишками" },
      { t: 84.2, text: "Я убит и разлагаюсь" },
      { t: 87.6, text: "под твои печали" }
    ];

    const audio = document.getElementById('audio');
    const player = document.getElementById('player');
    const playBtn = document.getElementById('playBtn');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const seek = document.getElementById('seek');
    const tCurrent = document.getElementById('tCurrent');
    const tDuration = document.getElementById('tDuration');
    const volume = document.getElementById('volume');
    const volIcon = document.getElementById('volIcon');
    const lBefore = document.getElementById('lBefore');
    const lActive = document.getElementById('lActive');
    const lAfter = document.getElementById('lAfter');
    const lCut = document.getElementById('lCut');
    const waveform = document.getElementById('waveform');

    for (let i = 0; i < 48; i++) {
      const bar = document.createElement('i');
      bar.style.setProperty('--bar', `${16 + ((i * 41) % 82)}%`);
      bar.style.setProperty('--delay', `${i * -0.038}s`);
      waveform.appendChild(bar);
    }

    const particles = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.style.left = `${Math.random() * 100}%`;
      s.style.animationDuration = `${9 + Math.random() * 14}s`;
      s.style.animationDelay = `${Math.random() * 12}s`;
      s.style.width = s.style.height = `${1 + Math.random() * 2.5}px`;
      particles.appendChild(s);
    }

    function fmt(v) {
      if (!Number.isFinite(v)) return '0:00';
      return `${Math.floor(v / 60)}:${Math.floor(v % 60).toString().padStart(2, '0')}`;
    }

    let lastIndex = -1;

    function getLyricIndex(time) {
      let idx = 0;
      for (let i = 0; i < timedLyrics.length; i++) {
        if (time >= timedLyrics[i].t) idx = i;
        else break;
      }
      return idx;
    }

    function updateLyrics(time) {
      const idx = getLyricIndex(time);
      if (idx === lastIndex) return;
      lastIndex = idx;

      const prev = timedLyrics[idx - 1];
      const curr = timedLyrics[idx];
      const next = timedLyrics[idx + 1];

      lBefore.textContent = prev ? prev.text : '';
      lActive.textContent = curr ? curr.text : '';
      lAfter.textContent = next ? next.text : '';
      lCut.textContent = curr ? curr.text : '';

      lActive.style.animation = 'none';
      void lActive.offsetWidth;
      lActive.style.animation = '';
    }

    function setPlaying(on) {
      player.classList.toggle('is-playing', on);
      iconPlay.style.display = on ? 'none' : 'block';
      iconPause.style.display = on ? 'block' : 'none';
      playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    }

    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch (e) {}
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    audio.addEventListener('ended', () => setPlaying(false));

    audio.addEventListener('loadedmetadata', () => {
      seek.max = audio.duration;
      tDuration.textContent = fmt(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const t = audio.currentTime;
      seek.value = t;
      seek.style.setProperty('--progress', `${(t / (audio.duration || 1)) * 100}%`);
      tCurrent.textContent = fmt(t);
      updateLyrics(t);
    });

    seek.addEventListener('input', () => {
      const v = Number(seek.value);
      audio.currentTime = v;
      tCurrent.textContent = fmt(v);
      lastIndex = -1;
      updateLyrics(v);
    });

    volume.addEventListener('input', () => {
      const v = Number(volume.value);
      audio.volume = v;
      if (v === 0) {
        volIcon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
      } else {
        volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
      }
    });

    audio.volume = 0.85;
    updateLyrics(0);
  </script>
</body>
</html>
