<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benzola</title>
  <meta name="description" content="Benzola · dark bio" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #020202;
      --text: #e6e4e0;
      --text-dim: #9a9690;
      --text-ghost: #5c5954;
      --blood: #a81818;
      --bone: #d2cec7;
      --font-d: "Cormorant Garamond", Georgia, serif;
      --font-s: "Manrope", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: var(--font-s);
      -webkit-font-smoothing: antialiased;
    }
    body { overflow-x: hidden; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    img { display: block; }

    @keyframes breathe {
      0%,100% { transform: scale(1.02); }
      50% { transform: scale(1.06); }
    }
    @keyframes drift {
      0%,100% { transform: translate(-2%,0); opacity:.25; }
      50% { transform: translate(3%,-2%); opacity:.45; }
    }
    @keyframes rain {
      from { background-position: 0 -100vh; }
      to { background-position: 20px 100vh; }
    }
    @keyframes pulse {
      0%,100% { opacity:.2; filter:blur(12px); }
      50% { opacity:.45; filter:blur(7px); }
    }
    @keyframes lyricIn {
      0% { opacity:0; transform:translateY(16px); filter:blur(6px); }
      100% { opacity:1; transform:translateY(0); filter:blur(0); }
    }
    @keyframes slash {
      0%,70%,100% { clip-path:inset(0 0 100% 0); }
      74% { clip-path:inset(40% 0 40% 0); transform:translateX(-3px); }
      80% { clip-path:inset(10% 0 60% 0); transform:translateX(4px); }
      86% { clip-path:inset(70% 0 5% 0); }
    }
    @keyframes wave {
      0%,100% { height:12%; }
      50% { height:var(--h); }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }
    @keyframes nameIn {
      from { opacity:0; letter-spacing:.4em; transform:translateY(10px); }
      to { opacity:1; letter-spacing:.2em; transform:translateY(0); }
    }
    @keyframes nameGlow {
      0%,100% { text-shadow:0 2px 20px #000,0 0 40px rgba(0,0,0,.7); }
      50% { text-shadow:0 2px 20px #000,0 0 50px rgba(168,24,24,.2); }
    }
    @keyframes floatP {
      0% { transform:translateY(0); opacity:0; }
      15% { opacity:.5; }
      100% { transform:translateY(-110vh); opacity:0; }
    }
    @keyframes sigil {
      0%,100% { opacity:.5; }
      50% { opacity:.95; }
    }

    /* ===== BACKGROUND — fixed, full viewport, HIGH visibility ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #050505;
      pointer-events: none;
      overflow: hidden;
    }
    .bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* main forest — strong */
    .bg-1 {
      opacity: .85;
      filter: grayscale(1) contrast(1.3) brightness(.55);
      animation: breathe 24s ease-in-out infinite;
    }
    /* second forest layer */
    .bg-2 {
      opacity: .55;
      filter: grayscale(1) contrast(1.2) brightness(.5);
      mix-blend-mode: soft-light;
    }
    /* third depth */
    .bg-3 {
      opacity: .4;
      filter: grayscale(1) contrast(1.4) brightness(.4);
      mix-blend-mode: multiply;
    }
    /* tree accent right */
    .bg-4 {
      opacity: .3;
      filter: grayscale(.4) saturate(.5) contrast(1.25) brightness(.55);
      mix-blend-mode: screen;
      clip-path: polygon(40% 0,100% 0,100% 70%,55% 60%);
    }
    /* river bottom */
    .bg-5 {
      opacity: .35;
      filter: grayscale(.6) contrast(1.6) brightness(.5);
      mix-blend-mode: screen;
      clip-path: polygon(0 50%,48% 58%,60% 100%,0 100%);
    }
    .bg-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 80% at 50% 40%, transparent 10%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.65) 100%),
        linear-gradient(180deg, rgba(0,0,0,.15) 0%, transparent 20%, transparent 50%, rgba(0,0,0,.4) 100%);
    }
    .bg-mist {
      position: absolute;
      left: -20%; right: -20%;
      bottom: 5%;
      height: 30%;
      background: radial-gradient(ellipse, rgba(200,195,185,.25), transparent 70%);
      filter: blur(40px);
      animation: drift 12s ease-in-out infinite;
    }
    .bg-mist2 {
      bottom: 35%;
      height: 18%;
      opacity: .7;
      animation-delay: -5s;
      animation-duration: 18s;
    }
    .bg-ash {
      position: absolute;
      inset: 0;
      opacity: .12;
      background-image: repeating-linear-gradient(95deg, transparent 0 50px, rgba(180,180,180,.5) 51px 52px, transparent 53px 100px);
      background-size: 110px 160vh;
      transform: rotate(6deg) scale(1.3);
      animation: rain 10s linear infinite;
    }
    .bg-particles { position:absolute; inset:0; overflow:hidden; }
    .bg-particles i {
      position:absolute; bottom:-6px;
      width:2px; height:2px;
      background:rgba(200,200,200,.5);
      border-radius:50%;
      animation: floatP linear infinite;
    }

    /* ===== PAGE LAYOUT ===== */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HERO */
    .hero {
      width: 100%;
      height: min(38vh, 340px);
      min-height: 200px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      filter: grayscale(.85) contrast(1.25) brightness(.55);
      animation: breathe 18s ease-in-out infinite;
    }
    .hero-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,.2) 0%,
        transparent 25%,
        transparent 40%,
        rgba(0,0,0,.5) 72%,
        rgba(0,0,0,.85) 90%,
        transparent 100%);
    }
    .hero-name {
      position: absolute;
      left: 0; right: 0;
      bottom: 14%;
      text-align: center;
      z-index: 2;
    }
    .hero-name .cross {
      display: block;
      font-family: var(--font-d);
      font-size: 20px;
      color: var(--blood);
      margin-bottom: 4px;
      animation: sigil 3.5s ease-in-out infinite;
      text-shadow: 0 0 18px rgba(168,24,24,.5);
    }
    .hero-name h1 {
      font-family: var(--font-d);
      font-weight: 300;
      font-size: clamp(40px, 10vw, 68px);
      letter-spacing: .2em;
      color: var(--bone);
      animation: nameIn 1.3s ease-out both, nameGlow 5s ease-in-out 1.3s infinite;
    }

    /* CONTENT */
    .wrap {
      width: min(100%, 400px);
      padding: 0 18px 44px;
      margin-top: -20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .meta {
      text-align: center;
      animation: fadeUp .9s .15s ease-out both;
    }
    .meta .tag {
      font-size: 9px;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-shadow: 0 1px 6px #000;
    }
    .meta .quote {
      font-family: var(--font-d);
      font-style: italic;
      font-size: 14px;
      color: rgba(210,206,199,.55);
      text-shadow: 0 1px 8px #000;
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      animation: fadeUp .9s .25s ease-out both;
    }
    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 14px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(8,8,10,.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .links a:hover {
      border-color: rgba(255,255,255,.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,.5);
    }
    .links a span { display:flex; align-items:center; gap:8px; }
    .links a small { font-size:8px; color:var(--text-ghost); }
    .links a svg { width:13px; height:13px; opacity:.4; }

    /* PLAYER */
    .player {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(6,6,8,.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .9s .35s ease-out both;
      position: relative;
    }
    .player.on {
      border-color: rgba(168,24,24,.3);
    }
    .player-glow {
      position: absolute;
      top: -4px; left: 20%;
      width: 60%; height: 8px;
      border-radius: 50%;
      background: var(--blood);
      opacity: .15;
      filter: blur(10px);
      pointer-events: none;
    }
    .player.on .player-glow { animation: pulse 2.4s ease-in-out infinite; }

    .row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
    }
    .btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(210,206,199,.3);
      background: var(--bone);
      color: #020202;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .2s, box-shadow .3s;
    }
    .btn:hover { transform: scale(1.06); box-shadow: 0 0 20px rgba(168,24,24,.3); }
    .btn svg { width:16px; height:16px; }
    .btn .play { transform: translateX(1px); }

    .info { min-width:0; display:grid; gap:4px; }
    .info-top {
      display:flex; align-items:center; justify-content:space-between; gap:6px;
    }
    .info-top strong {
      font-family: var(--font-d);
      font-weight: 400;
      font-size: 15px;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info-top a {
      font-size: 8px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-ghost);
      text-decoration: none;
      flex-shrink: 0;
    }
    .info-top a:hover { color: var(--bone); }

    .seek {
      --p: 0%;
      width: 100%;
      height: 3px;
      appearance: none;
      border-radius: 2px;
      background: linear-gradient(to right, var(--blood) var(--p), rgba(255,255,255,.12) var(--p));
      cursor: pointer;
    }
    .seek::-webkit-slider-thumb {
      appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 8px rgba(168,24,24,.4);
    }
    .times {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: var(--text-ghost);
      font-variant-numeric: tabular-nums;
    }
    .vol {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .vol svg { width:12px; height:12px; color:var(--text-ghost); }
    .vol input { width:46px; accent-color:var(--blood); }

    .lyrics {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height .75s cubic-bezier(.22,.8,.22,1), opacity .35s;
    }
    .player.on .lyrics {
      max-height: 210px;
      opacity: 1;
    }
    .stage {
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 10px 12px 4px;
    }
    .line-on {
      font-family: var(--font-d);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(18px, 5vw, 26px);
      line-height: 1.15;
      color: var(--bone);
      margin: 4px 0;
      max-width: 100%;
      text-shadow: 0 0 16px rgba(0,0,0,.6);
      animation: lyricIn .45s ease-out both;
    }
    .line-off {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-ghost);
      opacity: .5;
      max-width: 92%;
    }
    .line-cut {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-family: var(--font-d);
      font-style: italic;
      font-size: clamp(18px, 5vw, 26px);
      color: var(--blood);
      opacity: .3;
      animation: slash 4.8s steps(1) infinite;
      padding: 10px 12px;
    }
    .wave {
      height: 22px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 12px 10px;
      opacity: .4;
    }
    .wave i {
      flex: 1;
      min-width: 2px;
      height: 10%;
      border-radius: 2px;
      background: linear-gradient(to top, rgba(168,24,24,.6), var(--bone));
    }
    .player.on .wave i {
      animation: wave .55s ease-in-out infinite alternate;
      animation-delay: var(--d);
    }

    .foot {
      padding: 0 0 16px;
      font-size: 7px;
      letter-spacing: .28em;
      color: rgba(180,175,170,.22);
      text-align: center;
    }

    @media (max-width:520px) {
      .hero { height:min(32vh,260px); min-height:180px; }
      .hero-name h1 { font-size:clamp(32px,11vw,48px); letter-spacing:.14em; }
      .wrap { padding:0 14px 36px; margin-top:-14px; }
      .vol { display:none; }
      .row { grid-template-columns:44px 1fr; }
      .bg-4 { opacity:.2; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
      }
    }
  </style>
</head>
<body>
  <!-- BACKGROUND LAYERS (fixed, always visible) -->
  <div class="bg" aria-hidden="true">
    <img class="bg-1" src="dark-canopy.jpg" alt="" />
    <img class="bg-2" src="mist-forest.jpg" alt="" />
    <img class="bg-3" src="black-forest.png" alt="" />
    <img class="bg-4" src="crimson-tree.webp" alt="" />
    <img class="bg-5" src="winter-river.png" alt="" />
    <div class="bg-vignette"></div>
    <div class="bg-mist"></div>
    <div class="bg-mist bg-mist2"></div>
    <div class="bg-ash"></div>
    <div class="bg-particles" id="parts"></div>
  </div>

  <div class="page">
    <header class="hero">
      <img src="fangs.webp" alt="" />
      <div class="hero-fade"></div>
      <div class="hero-name">
        <span class="cross">†</span>
        <h1>BENZOLA</h1>
      </div>
    </header>

    <div class="wrap">
      <div class="meta">
        <p class="tag">fallen · beloved · eternal</p>
        <p class="quote">вечность пахнет дымом и снегом</p>
      </div>

      <nav class="links">
        <a href="https://www.tiktok.com/@kelli2458?_r=1&_t=ZG-99a2X7MxjEW" target="_blank" rel="noreferrer">
          <span><small>01</small>TikTok</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
        <a href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer">
          <span><small>02</small>Telegram</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </nav>

      <section class="player" id="player">
        <div class="player-glow"></div>
        <audio id="audio" src="Every-Time.mp3" preload="auto"></audio>
        <div class="row">
          <button class="btn" id="playBtn" aria-label="Play">
            <svg id="icPlay" class="play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="icPause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <div class="info">
            <div class="info-top">
              <strong>Every Time</strong>
              <a href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">Spotify ↗</a>
            </div>
            <input class="seek" id="seek" type="range" min="0" max="0" step="0.05" value="0" />
            <div class="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
          </div>
          <div class="vol">
            <svg id="volIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="0.85" />
          </div>
        </div>
        <div class="lyrics">
          <div class="stage">
            <p class="line-off" id="prev"></p>
            <p class="line-on" id="cur"></p>
            <p class="line-off" id="next"></p>
            <div class="line-cut" id="cut"></div>
          </div>
          <div class="wave" id="wave"></div>
        </div>
      </section>
    </div>
    <p class="foot">BENZOLA · IX · MMXXVI</p>
  </div>

  <script>
    /* Exact timestamps minus 0.35s so text appears ON the voice, not after */
    const L = [
      { t: 0,     s: "…" },
      { t: 3.9,   s: "Мне крутит голову прокуренный быт" },
      { t: 6.65,  s: "Ком лезет из горла" },
      { t: 8.2,   s: "Я твой невроз, социальная травма" },
      { t: 10.85, s: "Удары, порезы без повода" },
      { t: 12.55, s: "Мутная грязь" },
      { t: 14.0,  s: "Среда обитания, нам с тобою комфортная" },
      { t: 17.1,  s: "Память насилует мозг" },
      { t: 18.75, s: "Я снова даю дешёвое слово" },
      { t: 21.35, s: "Мёртвое тело, сгнившее нутро" },
      { t: 25.15, s: "Меня тащит на панельный или тащит на притон" },
      { t: 29.55, s: "Я шагаю, шагаю, шагаю хуй пойми на чём" },
      { t: 33.95, s: "Может быть, о лучшей жизни завтра мне приснится сон" },
      { t: 38.7,  s: "О, мой Бог курит боль и колется ночами" },
      { t: 43.5,  s: "Кремируй вечный покой, ведь счастье за горами" },
      { t: 47.55, s: "Моя муза блюёт кровавыми кишками" },
      { t: 52.45, s: "Я убит и разлагаюсь под твои печали" },
      { t: 56.05, s: "О, мой Бог курит боль и колется ночами" },
      { t: 61.0,  s: "Кремируй вечный покой, ведь счастье за горами" },
      { t: 64.95, s: "Моя муза блюёт кровавыми кишками" },
      { t: 69.75, s: "Я убит и разлагаюсь под твои печали" },
      { t: 74.0,  s: "…" }
    ];

    const audio = document.getElementById('audio');
    const player = document.getElementById('player');
    const playBtn = document.getElementById('playBtn');
    const icPlay = document.getElementById('icPlay');
    const icPause = document.getElementById('icPause');
    const seek = document.getElementById('seek');
    const t0 = document.getElementById('t0');
    const t1 = document.getElementById('t1');
    const vol = document.getElementById('vol');
    const prev = document.getElementById('prev');
    const cur = document.getElementById('cur');
    const next = document.getElementById('next');
    const cut = document.getElementById('cut');
    const wave = document.getElementById('wave');

    for (let i = 0; i < 40; i++) {
      const b = document.createElement('i');
      b.style.setProperty('--h', (12 + (i * 37) % 78) + '%');
      b.style.setProperty('--d', (i * -0.04) + 's');
      wave.appendChild(b);
    }
    const parts = document.getElementById('parts');
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (9 + Math.random() * 12) + 's';
      p.style.animationDelay = Math.random() * 10 + 's';
      parts.appendChild(p);
    }

    function fmt(v) {
      if (!isFinite(v)) return '0:00';
      return Math.floor(v/60) + ':' + String(Math.floor(v%60)).padStart(2,'0');
    }

    let last = -1;
    function lyricAt(t) {
      let i = 0;
      for (let k = 0; k < L.length; k++) {
        if (t >= L[k].t) i = k; else break;
      }
      return i;
    }
    function show(t) {
      const i = lyricAt(t);
      if (i === last) return;
      last = i;
      prev.textContent = L[i-1] ? L[i-1].s : '';
      cur.textContent = L[i] ? L[i].s : '';
      next.textContent = L[i+1] ? L[i+1].s : '';
      cut.textContent = L[i] ? L[i].s : '';
      cur.style.animation = 'none';
      void cur.offsetWidth;
      cur.style.animation = '';
    }

    function setOn(on) {
      player.classList.toggle('on', on);
      icPlay.style.display = on ? 'none' : 'block';
      icPause.style.display = on ? 'block' : 'none';
    }

    playBtn.onclick = async () => {
      if (audio.paused) { try { await audio.play(); } catch(e){} }
      else audio.pause();
    };
    audio.onplay = () => setOn(true);
    audio.onpause = () => setOn(false);
    audio.onended = () => setOn(false);
    audio.onloadedmetadata = () => {
      seek.max = audio.duration;
      t1.textContent = fmt(audio.duration);
    };
    audio.ontimeupdate = () => {
      const t = audio.currentTime;
      seek.value = t;
      seek.style.setProperty('--p', (t / (audio.duration||1) * 100) + '%');
      t0.textContent = fmt(t);
      show(t);
    };
    seek.oninput = () => {
      const v = +seek.value;
      audio.currentTime = v;
      t0.textContent = fmt(v);
      last = -1;
      show(v);
    };
    vol.oninput = () => { audio.volume = +vol.value; };
    audio.volume = 0.85;
    show(0);
  </script>
</body>
</html>
