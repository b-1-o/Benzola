<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benzola</title>
  <meta name="description" content="Benzola · dark bio" />
  <meta property="og:title" content="Benzola" />
  <meta property="og:description" content="вечность пахнет дымом и снегом" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #030303;
      --bg: #070708;
      --surface: #0e0e10;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #e4e2de;
      --text-dim: #7a7772;
      --text-ghost: #4a4845;
      --blood: #6e1515;
      --blood-bright: #a81818;
      --bone: #cfcbc4;
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Manrope", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--void); }
    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }

    @keyframes breathe {
      0%, 100% { transform: scale(1.02); }
      50% { transform: scale(1.055); }
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(-2%, 1%, 0); opacity: 0.1; }
      50% { transform: translate3d(3%, -2%, 0); opacity: 0.2; }
    }
    @keyframes rain {
      from { background-position: 0 -120vh; }
      to { background-position: 16px 120vh; }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.15; filter: blur(14px); }
      50% { opacity: 0.35; filter: blur(8px); }
    }
    @keyframes lyric-in {
      0% { opacity: 0; transform: translateY(20px) scale(0.96); filter: blur(8px); }
      55% { opacity: 1; filter: blur(0); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes slash {
      0%, 72%, 100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
      76% { clip-path: inset(40% 0 40% 0); transform: translateX(-4px); }
      80% { clip-path: inset(12% 0 60% 0); transform: translateX(5px); }
      86% { clip-path: inset(70% 0 8% 0); transform: translateX(-2px); }
    }
    @keyframes wave {
      0%, 100% { height: 12%; }
      50% { height: var(--bar); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes name-in {
      from { opacity: 0; transform: translateY(12px); letter-spacing: 0.35em; }
      to { opacity: 1; transform: translateY(0); letter-spacing: 0.22em; }
    }
    @keyframes name-glow {
      0%, 100% { text-shadow: 0 2px 24px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.5); }
      50% { text-shadow: 0 2px 24px rgba(0,0,0,0.9), 0 0 50px rgba(168,24,24,0.15); }
    }
    @keyframes particle {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      12% { opacity: 0.4; }
      90% { opacity: 0.12; }
      100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
    }
    @keyframes sigil-pulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.06); }
    }
    @keyframes hero-breathe {
      0%, 100% { transform: scale(1.04); }
      50% { transform: scale(1.08); }
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      isolation: isolate;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: min(42vh, 380px);
      min-height: 240px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      filter: grayscale(0.9) contrast(1.35) brightness(0.48);
      animation: hero-breathe 20s ease-in-out infinite;
      transform-origin: center 40%;
    }
    .hero-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(3,3,3,0.25) 0%,
          transparent 25%,
          transparent 45%,
          rgba(3,3,3,0.55) 70%,
          rgba(3,3,3,0.92) 88%,
          var(--bg) 100%
        ),
        radial-gradient(ellipse 90% 70% at 50% 40%, transparent 0%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }
    .hero-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18%;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
    }
    .hero-name .sigil {
      display: block;
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--blood-bright);
      line-height: 1;
      margin-bottom: 6px;
      animation: sigil-pulse 4s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(168,24,24,0.45);
    }
    .hero-name h1 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(42px, 11vw, 72px);
      letter-spacing: 0.22em;
      color: var(--bone);
      line-height: 1;
      animation: name-in 1.4s ease-out both, name-glow 5s ease-in-out 1.4s infinite;
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: var(--void);
      overflow: hidden;
      pointer-events: none;
    }
    .scene > * { position: absolute; inset: 0; width: 100%; height: 100%; }

    .layer-canopy {
      object-fit: cover;
      opacity: 0.4;
      filter: grayscale(1) contrast(1.2) brightness(0.32);
      animation: breathe 26s ease-in-out infinite;
    }
    .layer-mist {
      object-fit: cover;
      opacity: 0.25;
      filter: grayscale(1) contrast(1.1) brightness(0.4);
      mix-blend-mode: soft-light;
    }
    .layer-forest {
      object-fit: cover;
      opacity: 0.2;
      filter: grayscale(1) contrast(1.3) brightness(0.28);
      mix-blend-mode: multiply;
    }
    .vignette {
      background:
        radial-gradient(ellipse 90% 80% at 50% 50%, transparent 0%, transparent 35%, rgba(3,3,3,0.5) 70%, var(--void) 100%);
    }
    .mist {
      inset: auto -20% 8%;
      height: 24%;
      background: radial-gradient(ellipse, rgba(170,166,160,0.12), transparent 65%);
      filter: blur(34px);
      animation: drift 15s ease-in-out infinite;
    }
    .mist-2 {
      bottom: 40%;
      height: 14%;
      opacity: 0.07;
      animation-delay: -7s;
      animation-duration: 20s;
    }
    .ash {
      opacity: 0.06;
      background-image: repeating-linear-gradient(
        96deg,
        transparent 0 60px,
        rgba(150,150,150,0.35) 61px 62px,
        transparent 63px 115px
      );
      background-size: 130px 180vh;
      transform: rotate(5deg) scale(1.2);
      animation: rain 12s linear infinite;
    }
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particles span {
      position: absolute;
      bottom: -8px;
      background: rgba(170,170,170,0.35);
      border-radius: 50%;
      animation: particle linear infinite;
    }

    .shell {
      width: min(100%, 400px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 1;
      padding: 8px 20px 48px;
      margin-top: -28px;
    }

    .bio-meta {
      text-align: center;
      animation: fade-up 1s 0.2s ease-out both;
    }
    .eyebrow {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .motto {
      font-family: var(--font-display);
      font-size: 15px;
      font-style: italic;
      color: rgba(207,203,196,0.48);
      letter-spacing: 0.02em;
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      animation: fade-up 1s 0.3s ease-out both;
    }
    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(18,18,20,0.9), rgba(12,12,14,0.75));
      color: var(--text);
      text-decoration: none;
      backdrop-filter: blur(14px);
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 25%, rgba(168,24,24,0.07), transparent 75%);
      opacity: 0;
      transition: opacity 0.35s;
    }
    .link:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    }
    .link:hover::before { opacity: 1; }
    .link-inner {
      display: flex;
      align-items: center;
      gap: 9px;
      position: relative;
      z-index: 1;
    }
    .link-num {
      font-size: 8px;
      font-weight: 500;
      color: var(--text-ghost);
      letter-spacing: 0.06em;
    }
    .link-label {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .link svg {
      width: 14px;
      height: 14px;
      opacity: 0.35;
      transition: opacity 0.25s, transform 0.25s;
      position: relative;
      z-index: 1;
    }
    .link:hover svg {
      opacity: 0.8;
      transform: translate(1px, -1px);
    }

    .player {
      width: 100%;
      position: relative;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(165deg, rgba(12,12,14,0.94), rgba(8,8,10,0.9));
      box-shadow: 0 20px 50px rgba(0,0,0,0.55), inset 0 1px rgba(255,255,255,0.03);
      backdrop-filter: blur(18px);
      overflow: hidden;
      transition: border-color 0.45s, box-shadow 0.45s;
      animation: fade-up 1s 0.4s ease-out both;
    }
    .player.is-playing {
      border-color: rgba(168,24,24,0.25);
      box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 28px rgba(168,24,24,0.05), inset 0 1px rgba(255,255,255,0.03);
    }
    .player-glow {
      position: absolute;
      top: -5px;
      left: 20%;
      width: 60%;
      height: 8px;
      border-radius: 50%;
      background: var(--blood-bright);
      opacity: 0.12;
      filter: blur(10px);
      pointer-events: none;
    }
    .player.is-playing .player-glow {
      animation: pulse-soft 2.5s ease-in-out infinite;
    }

    .player-top {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 11px 11px 8px;
    }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(207,203,196,0.25);
      background: var(--bone);
      color: var(--void);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.3s;
    }
    .play-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 20px rgba(168,24,24,0.28);
    }
    .play-btn svg { width: 17px; height: 17px; }
    .play-offset { transform: translateX(1.5px); }

    .track-meta {
      min-width: 0;
      display: grid;
      gap: 5px;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .track-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .track-title svg {
      width: 11px;
      height: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .track-title strong {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 400;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spotify {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-ghost);
      text-decoration: none;
      transition: color 0.25s;
      flex-shrink: 0;
    }
    .spotify:hover { color: var(--bone); }
    .spotify svg { width: 9px; height: 9px; }

    .seek {
      --progress: 0%;
      width: 100%;
      height: 2.5px;
      appearance: none;
      border-radius: 2px;
      background: linear-gradient(to right, var(--blood-bright) var(--progress), rgba(255,255,255,0.08) var(--progress));
      cursor: pointer;
    }
    .seek::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 10px rgba(168,24,24,0.35);
      cursor: pointer;
    }
    .seek::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 10px rgba(168,24,24,0.35);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
    }
    .time-row time {
      font-size: 8px;
      color: var(--text-ghost);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }

    .vol {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 2px;
    }
    .vol svg {
      width: 13px;
      height: 13px;
      color: var(--text-ghost);
    }
    .vol input {
      width: 48px;
      accent-color: var(--blood-bright);
      cursor: pointer;
    }

    .lyrics-wrap {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.8s cubic-bezier(0.22, 0.8, 0.22, 1), opacity 0.4s ease;
    }
    .player.is-playing .lyrics-wrap {
      max-height: 220px;
      opacity: 1;
    }

    .lyric-stage {
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 12px 14px 4px;
      overflow: hidden;
    }
    .lyric-active {
      margin: 5px 0;
      max-width: 100%;
      font-family: var(--font-display);
      font-size: clamp(20px, 5.4vw, 30px);
      font-style: italic;
      font-weight: 300;
      line-height: 1.08;
      color: var(--bone);
      text-shadow: 0 0 18px rgba(0,0,0,0.5);
      animation: lyric-in 0.55s cubic-bezier(0.2, 0.85, 0.2, 1) both;
    }
    .lyric-ghost {
      margin: 0;
      max-width: 90%;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-ghost);
      opacity: 0.5;
    }
    .lyric-cut {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px 14px;
      pointer-events: none;
      font-family: var(--font-display);
      font-size: clamp(20px, 5.4vw, 30px);
      font-style: italic;
      color: var(--blood-bright);
      opacity: 0.35;
      animation: slash 5s steps(1) infinite;
    }

    .waveform {
      height: 24px;
      display: flex;
      align-items: center;
      gap: 2.5px;
      padding: 0 14px 12px;
      opacity: 0.38;
    }
    .waveform i {
      display: block;
      flex: 1;
      height: 10%;
      min-width: 2px;
      border-radius: 2px;
      background: linear-gradient(to top, rgba(168,24,24,0.6), var(--bone));
    }
    .player.is-playing .waveform i {
      animation: wave 0.6s ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .footer {
      position: relative;
      z-index: 2;
      padding: 0 0 16px;
      text-align: center;
      font-size: 7px;
      letter-spacing: 0.3em;
      color: rgba(170,166,160,0.2);
    }

    @media (max-width: 520px) {
      .hero {
        height: min(36vh, 300px);
        min-height: 200px;
      }
      .hero-name { bottom: 14%; }
      .hero-name h1 {
        font-size: clamp(36px, 12vw, 52px);
        letter-spacing: 0.16em;
      }
      .shell {
        padding: 4px 14px 40px;
        margin-top: -20px;
      }
      .vol { display: none; }
      .player-top { grid-template-columns: 46px 1fr; }
      .links { gap: 8px; }
      .link { height: 48px; padding: 0 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <img class="hero-img" src="fangs.webp" alt="" />
      <div class="hero-shade"></div>
      <div class="hero-name">
        <span class="sigil">†</span>
        <h1>BENZOLA</h1>
      </div>
    </header>

    <div class="scene" aria-hidden="true">
      <img class="layer-canopy" src="dark-canopy.jpg" alt="" />
      <img class="layer-mist" src="mist-forest.jpg" alt="" />
      <img class="layer-forest" src="black-forest.png" alt="" />
      <div class="vignette"></div>
      <div class="mist"></div>
      <div class="mist mist-2"></div>
      <div class="ash"></div>
      <div class="particles" id="particles"></div>
    </div>

    <div class="shell">
      <div class="bio-meta">
        <p class="eyebrow">fallen · beloved · eternal</p>
        <p class="motto">вечность пахнет дымом и снегом</p>
      </div>

      <nav class="links" aria-label="Links">
        <a class="link" href="https://www.tiktok.com/@kelli2458?_r=1&_t=ZG-99a2X7MxjEW" target="_blank" rel="noreferrer">
          <span class="link-inner">
            <span class="link-num">01</span>
            <span class="link-label">TikTok</span>
          </span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
        <a class="link" href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer">

          </span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </nav>

      <section class="player" id="player" aria-label="Music player">
        <div class="player-glow"></div>
        <audio id="audio" src="Every-Time.mp3" preload="metadata"></audio>

        <div class="player-top">
          <button class="play-btn" id="playBtn" aria-label="Play">
            <svg id="iconPlay" class="play-offset" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="iconPause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>

          <div class="track-meta">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <strong>Every Time</strong>
              </div>
              <a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">
                Spotify
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
            <input class="seek" id="seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="Position" />
            <div class="time-row">
              <time id="tCurrent">0:00</time>
              <time id="tDuration">0:00</time>

          </div>

          <div class="vol">
            <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="0.85" aria-label="Volume" />
          </div>
        </div>

        <div class="lyrics-wrap">
          <div class="lyric-stage" aria-live="polite">
            <p class="lyric-ghost" id="lBefore"></p>
            <p class="lyric-active" id="lActive"></p>
            <p class="lyric-ghost" id="lAfter"></p>
            <div class="lyric-cut" id="lCut" aria-hidden="true"></div>
          </div>
          <div class="waveform" id="waveform" aria-hidden="true"></div>
        </div>
      </section>
    </div>

    <p class="footer">BENZOLA · IX · MMXXVI</p>
  </main>

  <script>
    const timedLyrics = [
      { t: 0.0,  text: "…" },
      { t: 2.6,  text: "Мне крутит голову" },
      { t: 5.0,  text: "Прокуренный быт" },
      { t: 7.2,  text: "Ком лезет из горла" },
      { t: 9.4,  text: "Я твой невроз" },
      { t: 11.5, text: "Социальная травма" },
      { t: 13.8, text: "Удары, порезы без повода" },
      { t: 17.0, text: "Мутная грязь — среда обитания" },
      { t: 20.2, text: "Нам с тобою комфортная" },
      { t: 23.0, text: "Память насилует мозг" },
      { t: 25.6, text: "Я снова даю дешевое слово" },
      { t: 28.8, text: "Мертвое тело — сгнившее нутро" },
      { t: 32.0, text: "Меня тянет на панельный" },
      { t: 34.4, text: "Или тянет на притон" },
      { t: 36.8, text: "Я шагаю, шагаю, шагаю" },
      { t: 39.4, text: "Хуй пойми на чем" },
      { t: 41.8, text: "Может быть о лучшей жизни" },
      { t: 44.6, text: "Завтра мне приснится сон" },
      { t: 47.4, text: "О мой бог курит боль" },
      { t: 50.0, text: "И колется ночами" },
      { t: 52.4, text: "Кремируй вечный покой" },
      { t: 55.0, text: "Ведь счастье за горами" },
      { t: 57.8, text: "Моя муза блюет" },
      { t: 60.2, text: "Кровавыми кишками" },
      { t: 62.8, text: "Я убит и разлагаюсь" },
      { t: 65.6, text: "под твои печали" },
      { t: 68.5, text: "Мне крутит голову" },
      { t: 71.0, text: "Прокуренный быт" },
      { t: 73.4, text: "Ком лезет из горла" },
      { t: 75.6, text: "Я твой невроз" },
      { t: 78.0, text: "Социальная травма" },
      { t: 80.4, text: "Удары, порезы без повода" },
      { t: 83.6, text: "Мутная грязь — среда обитания" },
      { t: 87.0, text: "Нам с тобою комфортная" }
    ];

    const audio = document.getElementById('audio');
    const player = document.getElementById('player');
    const playBtn = document.getElementById('playBtn');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const seek = document.getElementById('seek');
    const tCurrent = document.getElementById('tCurrent');
    const tDuration = document.getElementById('tDuration');
    const volume = document.getElementById('volume');
    const volIcon = document.getElementById('volIcon');
    const lBefore = document.getElementById('lBefore');
    const lActive = document.getElementById('lActive');
    const lAfter = document.getElementById('lAfter');
    const lCut = document.getElementById('lCut');
    const waveform = document.getElementById('waveform');

    for (let i = 0; i < 44; i++) {
      const bar = document.createElement('i');
      bar.style.setProperty('--bar', `${14 + ((i * 39) % 80)}%`);
      bar.style.setProperty('--delay', `${i * -0.04}s`);
      waveform.appendChild(bar);
    }

    const particles = document.getElementById('particles');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.style.left = `${Math.random() * 100}%`;
      s.style.animationDuration = `${11 + Math.random() * 13}s`;
      s.style.animationDelay = `${Math.random() * 10}s`;
      s.style.width = s.style.height = `${1 + Math.random() * 2}px`;
      particles.appendChild(s);
    }

    function fmt(v) {
      if (!Number.isFinite(v)) return '0:00';
      return `${Math.floor(v / 60)}:${Math.floor(v % 60).toString().padStart(2, '0')}`;
    }

    let lastIndex = -1;

    function getLyricIndex(time) {
      let idx = 0;
      for (let i = 0; i < timedLyrics.length; i++) {
        if (time >= timedLyrics[i].t) idx = i;
        else break;
      }
      return idx;
    }

    function updateLyrics(time) {
      const idx = getLyricIndex(time);
      if (idx === lastIndex) return;
      lastIndex = idx;
      const prev = timedLyrics[idx - 1];
      const curr = timedLyrics[idx];
      const next = timedLyrics[idx + 1];
      lBefore.textContent = prev ? prev.text : '';
      lActive.textContent = curr ? curr.text : '';
      lAfter.textContent = next ? next.text : '';
      lCut.textContent = curr ? curr.text : '';
      lActive.style.animation = 'none';
      void lActive.offsetWidth;
      lActive.style.animation = '';
    }

    function setPlaying(on) {
      player.classList.toggle('is-playing', on);
      iconPlay.style.display = on ? 'none' : 'block';
      iconPause.style.display = on ? 'block' : 'none';
      playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    }

    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch (e) {}
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    audio.addEventListener('ended', () => setPlaying(false));

    audio.addEventListener('loadedmetadata', () => {
      seek.max = audio.duration;
      tDuration.textContent = fmt(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const t = audio.currentTime;
      seek.value = t;
      seek.style.setProperty('--progress', `${(t / (audio.duration || 1)) * 100}%`);
      tCurrent.textContent = fmt(t);
      updateLyrics(t);
    });

    seek.addEventListener('input', () => {
      const v = Number(seek.value);
      audio.currentTime = v;
      tCurrent.textContent = fmt(v);
      lastIndex = -1;
      updateLyrics(v);
    });

    volume.addEventListener('input', () => {
      const v = Number(volume.value);
      audio.volume = v;
      if (v === 0) {
        volIcon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
      } else {
        volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
      }
    });

    audio.volume = 0.85;
    updateLyrics(0);
  </script>
</body>
</html>
