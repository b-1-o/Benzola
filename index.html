<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<meta name="color-scheme" content="dark">
<title>Benzola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#020202;--text:#e6e4e0;--ghost:#5c5954;--blood:#a81818;--bone:#d2cec7;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
a,button,input{-webkit-tap-highlight-color:transparent}button{font:inherit}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes name{0%{opacity:0;letter-spacing:.45em;filter:blur(7px);transform:translateY(12px)}100%{opacity:1;letter-spacing:.2em;filter:none;transform:none}}
@keyframes wave{50%{height:var(--h)}}
@keyframes shine{0%{transform:translateX(-140%);opacity:0}25%{opacity:.35}60%,100%{transform:translateX(230%);opacity:0}}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000;pointer-events:none;contain:strict}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg-1{opacity:.68;filter:grayscale(1) contrast(1.18) brightness(.48)}
.bg-2{opacity:.28;filter:grayscale(1) contrast(1.08) brightness(.52);mix-blend-mode:screen}
.bg-3{opacity:.2;filter:grayscale(1) contrast(1.25) brightness(.34);mix-blend-mode:multiply}
.bg-hood{opacity:.38;filter:grayscale(1) contrast(1.22) brightness(.45);mix-blend-mode:screen;object-position:center 72%;mask-image:radial-gradient(ellipse 70% 68% at 50% 70%,#000 0 35%,#000b 58%,transparent 84%);-webkit-mask-image:radial-gradient(ellipse 70% 68% at 50% 70%,#000 0 35%,#000b 58%,transparent 84%)}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 72% 78% at 50% 50%,transparent 15%,#0004 68%,#000d 100%),linear-gradient(#0000 45%,#000a 100%)}
.mist{position:absolute;left:-20%;right:-20%;bottom:4%;height:28%;background:radial-gradient(ellipse,#d2cdc31c,transparent 70%);filter:blur(22px);opacity:.5}
.ash,.particles{display:none}

.page{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;align-items:center}
.hero{position:relative;width:100%;height:min(43vh,390px);min-height:235px;isolation:isolate;overflow:hidden}
.hero-img{position:absolute;z-index:1;left:0;top:0;width:100%;height:128%;object-fit:cover;object-position:50% 0;transform:none;filter:grayscale(.78) contrast(1.1) brightness(.72);mask-image:linear-gradient(to bottom,#000 0 38%,#000f 50%,#000c 64%,#0006 78%,transparent 99%);-webkit-mask-image:linear-gradient(to bottom,#000 0 38%,#000f 50%,#000c 64%,#0006 78%,transparent 99%);transition:transform .55s cubic-bezier(.16,1,.3,1)}
.hero:before{content:"";position:absolute;z-index:0;left:-8%;right:-8%;top:20%;height:100%;background:url("fangs.webp") 50% 0/cover no-repeat;filter:grayscale(.8) brightness(.46) blur(24px);opacity:.32;mask-image:radial-gradient(ellipse 78% 72% at 50% 22%,#000 0 28%,#000b 55%,transparent 82%);-webkit-mask-image:radial-gradient(ellipse 78% 72% at 50% 22%,#000 0 28%,#000b 55%,transparent 82%);transition:transform .55s cubic-bezier(.16,1,.3,1)}
.hero:after{content:"";position:absolute;z-index:3;left:-25%;right:-25%;bottom:-28%;height:76%;background:radial-gradient(ellipse 58% 62% at 50% 0%,transparent 0 22%,#02020245 48%,#020202 78%),linear-gradient(to bottom,transparent 0,#02020255 34%,#020202 82%,#020202 100%);filter:blur(9px);pointer-events:none}
.hero-fade{position:absolute;z-index:4;inset:0;background:radial-gradient(ellipse 88% 76% at 50% 20%,transparent 22%,#0007 100%);pointer-events:none}
.hero-name{position:absolute;z-index:8;left:50%;bottom:17%;width:94%;transform:translateX(-50%);text-align:center;pointer-events:none}
.cross{display:block;color:var(--blood);font:300 25px/1 var(--serif)}
.hero-name h1{color:var(--bone);font:300 clamp(42px,8vw,78px)/.95 var(--serif);letter-spacing:.2em;animation:name 1.2s cubic-bezier(.16,1,.3,1) both;text-shadow:0 3px 30px #000}
.tagline{margin-top:13px;color:#ffffff9e;font-size:11px;letter-spacing:.4em;animation:fade .8s .35s both}

.wrap{position:relative;z-index:20;width:min(720px,calc(100% - 34px));margin-top:-30px;padding-bottom:48px}
.quote{text-align:center;margin-bottom:22px;color:#e6e4e0b8;font:italic 300 clamp(18px,3vw,24px)/1.3 var(--serif);text-shadow:0 2px 18px #000;animation:fade .7s .55s both}
.links{display:grid;gap:10px;margin-bottom:18px;max-height:145px;overflow:hidden;transition:max-height .5s cubic-bezier(.16,1,.3,1),opacity .3s,transform .5s,filter .3s,margin .5s}
.links a{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:65px;padding:0 18px 0 20px;border:1px solid #e6e4e01c;border-radius:17px;color:var(--text);text-decoration:none;overflow:hidden;background:linear-gradient(135deg,#ffffff0e,#ffffff03 55%,#a8181808);box-shadow:0 13px 40px #0006,inset 0 1px #ffffff0f;transition:transform .3s,border-color .3s;animation:fade .6s both}
.links a:nth-child(2){animation-delay:.07s}.links a:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff2 48%,transparent 62%);transform:translateX(-120%);pointer-events:none}.links a:hover{transform:translateY(-3px);border-color:#e6e4e03b}.links a:hover:before{animation:shine .9s forwards}
.link-main{display:flex;align-items:center;gap:13px}.link-icon{width:33px;height:33px;display:grid;place-items:center;border:1px solid #e6e4e018;border-radius:10px;background:#ffffff08}.link-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.link-copy{display:flex;flex-direction:column;gap:3px}.link-copy small{color:var(--ghost);font-size:8px;letter-spacing:.3em}.link-copy strong{font-size:14px;letter-spacing:.06em;font-weight:500}.link-arrow{color:#e6e4e066;font-size:17px}

.player{position:relative;overflow:hidden;border:1px solid #e6e4e01a;border-radius:19px;background:linear-gradient(145deg,#ffffff0d,#ffffff03);box-shadow:0 16px 52px #0007,inset 0 1px #ffffff0d;transition:transform .5s cubic-bezier(.16,1,.3,1),border-radius .45s,box-shadow .45s}
.player-top{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 16px 11px}.play{width:44px;height:44px;border:1px solid #e6e4e025;border-radius:13px;background:#ffffff08;color:var(--bone);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.play:active{transform:scale(.94)}.play svg{width:17px;height:17px;fill:currentColor}.track-title{font:400 18px/1 var(--serif)}.track-sub{margin-top:4px;color:var(--ghost);font-size:9px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spotify{color:#e6e4e066;text-decoration:none;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.wave{height:28px;display:flex;align-items:center;gap:2px;padding:0 16px}.wave i{flex:1;height:12%;border-radius:99px;background:#d2cec766;animation:none}.player.playing .wave i{animation:wave var(--d) ease-in-out infinite alternate}
.progress{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:3px 16px 9px;color:var(--ghost);font-size:9px}.controls{display:grid;grid-template-columns:1fr 80px;padding:0 16px 14px}.vol{display:flex;align-items:center;gap:8px;color:var(--ghost)}input[type=range]{width:100%;height:3px;appearance:none;background:#e6e4e01f;border-radius:99px;outline:0}input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--bone)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--bone)}
.lyrics{max-height:0;overflow:hidden;opacity:0;padding:0 18px;border-top:1px solid transparent;text-align:center;transition:max-height .55s cubic-bezier(.16,1,.3,1),opacity .3s,padding .45s,border-color .3s}.lyric{color:var(--bone);font:300 clamp(22px,4vw,34px)/1.18 var(--serif);min-height:72px;display:grid;place-items:center}.lyric.active{animation:fade .35s}
body.is-playing .links{max-height:0;opacity:0;transform:translateY(-10px);filter:blur(3px);margin:0;pointer-events:none}
body.is-playing .hero-img{transform:scaleX(.90)}
body.is-playing .hero:before{transform:scaleX(.90)}
.player.expanded{transform:translateY(-3px);border-radius:23px;box-shadow:0 25px 75px #0009}.player.expanded .lyrics{max-height:315px;opacity:1;padding:22px 18px 25px;border-color:#e6e4e012}.player.expanded .wave{height:38px}.player.expanded .lyric{font-size:clamp(25px,4.5vw,39px)}

@media(max-width:600px){
html,body{width:100%;overflow-x:hidden}
.bg-1{opacity:.62;filter:grayscale(1) contrast(1.12) brightness(.45)}.bg-2{opacity:.14;filter:grayscale(1) brightness(.5);mix-blend-mode:normal}.bg-3{display:none}.bg-hood{opacity:.26;filter:grayscale(1) contrast(1.15) brightness(.42);mix-blend-mode:normal}.mist{filter:blur(16px);opacity:.3}
.hero{height:clamp(220px,36svh,285px);min-height:220px}.hero-img{width:100vw;height:124%;object-position:50% 0;filter:grayscale(.78) contrast(1.08) brightness(.7);mask-image:linear-gradient(to bottom,#000 0 36%,#000f 48%,#000c 63%,#0006 78%,transparent 99%);-webkit-mask-image:linear-gradient(to bottom,#000 0 36%,#000f 48%,#000c 63%,#0006 78%,transparent 99%)}
.hero:before{left:-5%;right:-5%;top:20%;height:100%;filter:grayscale(.8) brightness(.44) blur(18px);opacity:.26;mask-image:radial-gradient(ellipse 80% 72% at 50% 22%,#000 0 25%,#000b 52%,transparent 82%);-webkit-mask-image:radial-gradient(ellipse 80% 72% at 50% 22%,#000 0 25%,#000b 52%,transparent 82%)}
.hero:after{left:-30%;right:-30%;bottom:-34%;height:82%;filter:blur(6px);background:radial-gradient(ellipse 62% 62% at 50% 0%,transparent 0 20%,#0202024d 48%,#020202 78%),linear-gradient(to bottom,transparent,#02020266 35%,#020202 78%)}
.hero-name{bottom:12%;width:96%}.hero-name h1{font-size:clamp(38px,11vw,55px);letter-spacing:.15em}.cross{font-size:23px}.tagline{font-size:8.5px;letter-spacing:.29em;margin-top:9px}
.wrap{width:calc(100% - 18px);margin-top:-10px;padding-bottom:max(28px,env(safe-area-inset-bottom))}.quote{margin-bottom:11px;font-size:18px}
.links{gap:7px;margin-bottom:8px;max-height:121px}.links a{min-height:54px;border-radius:13px;padding:0 13px 0 14px;box-shadow:0 8px 24px #0006}.link-main{gap:9px}.link-icon{width:28px;height:28px;border-radius:9px}.link-copy strong{font-size:12px}.link-copy small{font-size:7px}.link-arrow{font-size:14px}
.player{border-radius:16px;background:#080808e8;box-shadow:0 10px 32px #0008}.player-top{grid-template-columns:40px minmax(0,1fr) auto;gap:8px;padding:11px 12px 8px}.play{width:39px;height:39px;border-radius:11px}.track-title{font-size:15.5px}.track-sub{font-size:7px;letter-spacing:.1em}.spotify{font-size:7px;letter-spacing:.06em}.wave{height:19px;padding:0 12px;gap:1.5px}.progress{grid-template-columns:32px minmax(0,1fr) 32px;gap:5px;padding:2px 12px 7px;font-size:7.5px}.controls{grid-template-columns:1fr;padding:0 12px 9px}.vol{display:none}
.lyrics{padding-inline:6px}.player.expanded{transform:translateY(-38px);border-radius:18px;box-shadow:0 18px 52px #000a}.player.expanded .lyrics{max-height:325px;padding:20px 6px 24px}.player.expanded .wave{height:30px}.player.expanded .lyric{font-size:clamp(25px,7.4vw,35px);line-height:1.08;min-height:96px;padding:0 2px}
body.is-playing .hero-img{transform:scaleX(.90)}body.is-playing .hero:before{transform:scaleX(.90)}
}
@media(pointer:coarse){.links a:hover{transform:none}.links a:active{transform:scale(.985)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
/* Telegram WebView: render the smallest stable layer set. */
body.tg-webview .bg-1,body.tg-webview .bg-2{filter:grayscale(1) contrast(1.08) brightness(.45);mix-blend-mode:normal}body.tg-webview .bg-hood{display:none}body.tg-webview .bg-3{display:none}body.tg-webview .mist{display:none}body.tg-webview .player,body.tg-webview .links a{backdrop-filter:none;-webkit-backdrop-filter:none}body.tg-webview .player{background:#080808ed}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img class="bg-1" src="dark-canopy.jpg"><img class="bg-2" src="mist-forest.jpg"><img class="bg-3" src="black-forest.png"><img class="bg-hood" src="hooded.gif"><div class="mist"></div></div>
<main class="page">
<header class="hero"><img class="hero-img" src="fangs.webp" alt=""><div class="hero-fade"></div><div class="hero-name"><span class="cross">†</span><h1>BENZOLA</h1><div class="tagline">fallen · beloved · eternal</div></div></header>
<section class="wrap"><p class="quote">вечность пахнет дымом и снегом</p>
<nav class="links">

<a href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer"><span class="link-main"><span class="link-icon"><svg viewBox="0 0 24 24"><path d="m21 4-3.2 16-5.1-4.1-3 2.9.3-4.6L18.5 7l-9.1 5.6-4.2-1.5z"/></svg></span><span class="link-copy"><small>02</small><strong>Telegram</strong></span></span><span class="link-arrow">↗</span></a>
</nav>
<section class="player" id="player">
<audio id="audio" preload="metadata" playsinline src="Every-Time.mp3"></audio>
<div class="player-top"><button class="play" id="play" type="button" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13L19 12z"/></svg></button><div><div class="track-title">Every Time</div><div class="track-sub">Every Time · Benzola</div></div><a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">Spotify ↗</a></div>

</section><div class="footer">† eternal</div></section></main>
<script>
(function(){
const ua=navigator.userAgent||'';
const isTelegram=/Telegram/i.test(ua)||!!window.TelegramWebviewProxy;
if(isTelegram)document.body.classList.add('tg-webview');
const audio=document.getElementById('audio'),play=document.getElementById('play'),playIcon=document.getElementById('playIcon'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),lyric=document.getElementById('lyric'),player=document.getElementById('player'),wave=document.getElementById('wave');
const bars=isTelegram||matchMedia('(max-width:600px)').matches?18:28;
for(let i=0;i<bars;i++){const b=document.createElement('i');b.style.setProperty('--h',18+Math.random()*82+'%');b.style.setProperty('--d',.9+Math.random()*1.1+'s');wave.appendChild(b)}
const L=[
{t:0,s:'…'},{t:3.9,s:'Мне крутит голову прокуренный быт'},{t:6.65,s:'Ком лезет из горла'},{t:8.2,s:'Я твой невроз, социальная травма'},{t:10.85,s:'Удары, порезы без повода'},{t:12.55,s:'Мутная грязь'},{t:14,s:'Среда обитания, нам с тобою комфортная'},{t:17.1,s:'Память насилует мозг'},{t:18.75,s:'Я снова даю дешёвое слово'},{t:21.35,s:'Мёртвое тело, сгнившее нутро'},{t:25.15,s:'Меня тащит на панельный или тащит на притон'},{t:29.55,s:'Я шагаю, шагаю, шагаю хуй пойми на чём'},{t:33.95,s:'Может быть, о лучшей жизни завтра мне приснится сон'},{t:38.7,s:'О, мой Бог курит боль и колется ночами'},{t:43.5,s:'Кремируй вечный покой, ведь счастье за горами'},{t:47.55,s:'Моя муза блюёт кровавыми кишками'},{t:52.45,s:'Я убит и разлагаюсь под твои печали'},{t:56.05,s:'О, мой Бог курит боль и колется ночами'},{t:61,s:'Кремируй вечный покой, ведь счастье за горами'},{t:64.95,s:'Моя муза блюёт кровавыми кишками'},{t:69.75,s:'Я убит и разлагаюсь под твои печали'},{t:74,s:'…'}];
let current=-1,lastSecond=-1;
const fmt=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')};
function show(i){if(i===current)return;current=i;lyric.classList.remove('active');void lyric.offsetWidth;lyric.textContent=L[i]?L[i].s:'…';lyric.classList.add('active')}
function setPlaying(on){document.body.classList.toggle('is-playing',on);player.classList.toggle('expanded',on);player.classList.toggle('playing',on);playIcon.innerHTML=on?'<path d="M7 6h3v12H7zM14 6h3v12h-3z"/>':'<path d="M8 5.5v13L19 12z"/>';play.setAttribute('aria-label',on?'Pause':'Play')}
function togglePlay(){if(audio.paused){const p=audio.play();if(p&&p.catch)p.catch(()=>setPlaying(false))}else audio.pause()}
play.addEventListener('click',togglePlay);audio.addEventListener('play',()=>setPlaying(true));audio.addEventListener('pause',()=>setPlaying(false));audio.addEventListener('loadedmetadata',()=>dur.textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{const sec=Math.floor(audio.currentTime);if(sec===lastSecond)return;lastSecond=sec;cur.textContent=fmt(audio.currentTime);if(audio.duration)seek.value=audio.currentTime/audio.duration*100;let i=0;for(let n=0;n<L.length;n++){if(L[n].t<=audio.currentTime)i=n;else break}show(i)});audio.addEventListener('ended',()=>{setPlaying(false);seek.value=0;lastSecond=-1;show(0)});seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});volume.addEventListener('input',()=>audio.volume=+volume.value);audio.volume=.85;show(0);
})();
</script>
