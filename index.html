<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<meta name="color-scheme" content="dark">
<title>Benzola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#020202;--text:#e6e4e0;--dim:#9a9690;--ghost:#5c5954;--blood:#a81818;--bone:#d2cec7;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
a,button,input{-webkit-tap-highlight-color:transparent}
button{font:inherit}
@keyframes breathe{0%,100%{transform:scale(1.015)}50%{transform:scale(1.035)}}
@keyframes hood{0%,100%{opacity:.34}50%{opacity:.48}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes name{0%{opacity:0;letter-spacing:.45em;filter:blur(8px);transform:translateY(15px)}100%{opacity:1;letter-spacing:.2em;filter:none;transform:none}}
@keyframes wave{50%{height:var(--h)}}
@keyframes shine{0%{transform:translateX(-140%);opacity:0}25%{opacity:.4}60%,100%{transform:translateX(230%);opacity:0}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.3}100%{transform:translateY(-100vh);opacity:0}}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000;pointer-events:none}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg-1{opacity:.72;filter:grayscale(1) contrast(1.25) brightness(.48);animation:breathe 32s ease-in-out infinite}
.bg-2{opacity:.34;filter:grayscale(1) contrast(1.12) brightness(.52);mix-blend-mode:screen}
.bg-3{opacity:.26;filter:grayscale(1) contrast(1.35) brightness(.34);mix-blend-mode:multiply}
.bg-hood{opacity:.42;filter:grayscale(1) contrast(1.3) brightness(.45);mix-blend-mode:screen;object-position:center 72%;animation:hood 11s ease-in-out infinite;mask-image:radial-gradient(ellipse 70% 68% at 50% 70%,#000 0 35%,#000b 58%,transparent 84%);-webkit-mask-image:radial-gradient(ellipse 70% 68% at 50% 70%,#000 0 35%,#000b 58%,transparent 84%)}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 72% 78% at 50% 50%,transparent 15%,#0004 68%,#000c 100%),linear-gradient(#0000 48%,#0009)}
.mist{position:absolute;left:-20%;right:-20%;bottom:4%;height:30%;background:radial-gradient(ellipse,#d2cdc326,transparent 70%);filter:blur(35px);opacity:.7}
.ash{position:absolute;inset:0;opacity:.035;background-image:repeating-linear-gradient(95deg,transparent 0 70px,#aaa 71px 72px,transparent 73px 140px);background-size:140px 180vh;transform:rotate(6deg);animation:breathe 14s linear infinite}
.particles{position:absolute;inset:0}.particles i{position:absolute;bottom:-5px;width:2px;height:2px;border-radius:50%;background:#aaa;animation:float linear infinite}

.page{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;align-items:center}
.hero{position:relative;width:100%;height:min(47vh,430px);min-height:245px;isolation:isolate;overflow:hidden}
.hero-img{position:absolute;z-index:1;left:0;top:0;width:100%;height:125%;object-fit:cover;object-position:50% 0;transform:none;filter:grayscale(.78) contrast(1.1) brightness(.72);mask-image:linear-gradient(to bottom,#000 0 40%,#000f 52%,#000b 68%,#0004 84%,transparent 98%);-webkit-mask-image:linear-gradient(to bottom,#000 0 40%,#000f 52%,#000b 68%,#0004 84%,transparent 98%);animation:breathe 25s ease-in-out infinite}
.hero:before{content:"";position:absolute;z-index:0;left:-10%;right:-10%;top:25%;height:90%;background:url("fangs.webp") 50% 0/cover no-repeat;filter:grayscale(.8) brightness(.5) blur(30px);opacity:.35;mask-image:linear-gradient(#000 0 35%,#000b 65%,transparent);-webkit-mask-image:linear-gradient(#000 0 35%,#000b 65%,transparent)}
.hero:after{content:"";position:absolute;z-index:3;left:-15%;right:-15%;bottom:-18%;height:62%;background:radial-gradient(ellipse 52% 70% at 50% 0%,transparent 0 25%,#02020255 52%,#020202 88%);filter:blur(20px)}
.hero-fade{position:absolute;z-index:4;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 20%,transparent 25%,#0007 100%)}
.hero-name{position:absolute;z-index:8;left:50%;bottom:20%;width:94%;transform:translateX(-50%);text-align:center;pointer-events:none}
.cross{display:block;color:var(--blood);font:300 26px/1 var(--serif)}
.hero-name h1{color:var(--bone);font:300 clamp(42px,8vw,78px)/.95 var(--serif);letter-spacing:.2em;animation:name 1.35s cubic-bezier(.16,1,.3,1) both;text-shadow:0 3px 30px #000}
.tagline{margin-top:14px;color:#ffffff9e;font-size:11px;letter-spacing:.42em;animation:fade 1s .5s both}

.wrap{position:relative;z-index:20;width:min(720px,calc(100% - 34px));margin-top:-34px;padding-bottom:48px}
.quote{text-align:center;margin-bottom:25px;color:#e6e4e0b8;font:italic 300 clamp(18px,3vw,24px)/1.3 var(--serif);text-shadow:0 2px 18px #000;animation:fade .8s .7s both}
.links{display:grid;gap:12px;margin-bottom:22px;max-height:180px;overflow:hidden;transition:max-height .7s cubic-bezier(.16,1,.3,1),opacity .45s,transform .7s,filter .45s,margin .7s}
.links a{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:0 18px 0 20px;border:1px solid #e6e4e01c;border-radius:18px;color:var(--text);text-decoration:none;overflow:hidden;background:linear-gradient(135deg,#ffffff10,#ffffff03 55%,#a8181808);box-shadow:0 16px 45px #0006,inset 0 1px #ffffff10;transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .45s,box-shadow .45s;animation:fade .7s both}
.links a:nth-child(2){animation-delay:.08s}
.links a:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff2 48%,transparent 62%);transform:translateX(-120%);pointer-events:none}
.links a:hover{transform:translateY(-4px);border-color:#e6e4e03b;box-shadow:0 24px 60px #0008}
.links a:hover:before{animation:shine 1s forwards}
.link-main{display:flex;align-items:center;gap:14px}.link-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid #e6e4e018;border-radius:11px;background:#ffffff08}.link-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.link-copy{display:flex;flex-direction:column;gap:3px}.link-copy small{color:var(--ghost);font-size:9px;letter-spacing:.3em}.link-copy strong{font-size:14px;letter-spacing:.06em;font-weight:500}.link-arrow{color:#e6e4e066;font-size:17px}

.player{position:relative;overflow:hidden;border:1px solid #e6e4e01a;border-radius:20px;background:linear-gradient(145deg,#ffffff0e,#ffffff03);box-shadow:0 18px 60px #0007,inset 0 1px #ffffff0d;transition:transform .7s cubic-bezier(.16,1,.3,1),border-radius .6s,box-shadow .6s}
.player-top{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:16px 17px 12px}.play{width:44px;height:44px;border:1px solid #e6e4e025;border-radius:14px;background:#ffffff08;color:var(--bone);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.play:active{transform:scale(.94)}.play svg{width:17px;height:17px;fill:currentColor}.track-title{font:400 18px/1 var(--serif)}.track-sub{margin-top:4px;color:var(--ghost);font-size:9px;letter-spacing:.22em;text-transform:uppercase}.spotify{color:#e6e4e066;text-decoration:none;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.wave{height:30px;display:flex;align-items:center;gap:2px;padding:0 17px}.wave i{flex:1;height:12%;border-radius:99px;background:#d2cec766;animation:wave var(--d) ease-in-out infinite alternate}.progress{display:grid;grid-template-columns:42px 1fr 42px;gap:9px;align-items:center;padding:4px 17px 10px;color:var(--ghost);font-size:9px}.controls{display:grid;grid-template-columns:1fr 80px;padding:0 17px 15px}.vol{display:flex;align-items:center;gap:8px;color:var(--ghost)}input[type=range]{width:100%;height:3px;appearance:none;background:#e6e4e01f;border-radius:99px;outline:0}input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--bone)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--bone)}
.lyrics{max-height:0;overflow:hidden;opacity:0;padding:0 20px;border-top:1px solid transparent;text-align:center;transition:max-height .75s cubic-bezier(.16,1,.3,1),opacity .45s,padding .65s,border-color .5s}.lyric{color:var(--bone);font:300 clamp(22px,4vw,34px)/1.2 var(--serif);min-height:76px;display:grid;place-items:center}.lyric.active{animation:fade .45s}.footer{text-align:center;margin-top:22px;color:#e6e4e040;font-size:8px;letter-spacing:.35em;text-transform:uppercase}

body.is-playing .links{max-height:0;opacity:0;transform:translateY(-16px) scale(.98);filter:blur(6px);margin:0;pointer-events:none}.player.expanded{transform:translateY(-5px);border-radius:24px;box-shadow:0 30px 90px #0009,0 0 60px #a8181810}.player.expanded .lyrics{max-height:330px;opacity:1;padding:24px 20px 28px;border-color:#e6e4e012}.player.expanded .wave{height:40px}.player.expanded .lyric{font-size:clamp(25px,4.6vw,40px)}

@media(max-width:600px){
html,body{width:100%;overflow-x:hidden}
.bg-1{animation:none;transform:none}.bg-2{mix-blend-mode:normal;opacity:.22}.bg-3{mix-blend-mode:normal;opacity:.2}.bg-hood{animation:none;opacity:.34;mix-blend-mode:normal}.mist{filter:blur(22px);opacity:.45}.ash,.particles{display:none}
.hero{height:clamp(280px,56svh,390px);min-height:280px}.hero-img{left:0;width:100vw;height:120%;object-fit:cover;object-position:50% 0;transform:none;animation:none}.hero:before{left:-4%;right:-4%;filter:grayscale(.8) brightness(.48) blur(20px);opacity:.3}.hero:after{filter:blur(16px)}
.hero-name{bottom:16%;width:96%}.hero-name h1{font-size:clamp(39px,12vw,58px);letter-spacing:.16em}.tagline{font-size:9px;letter-spacing:.3em;margin-top:11px}.cross{font-size:23px}
.wrap{width:calc(100% - 20px);margin-top:-22px;padding-bottom:max(34px,env(safe-area-inset-bottom))}.quote{margin-bottom:18px;font-size:20px}
.links{gap:9px;margin-bottom:14px;max-height:138px}.links a{min-height:62px;border-radius:15px;padding:0 15px 0 16px;box-shadow:0 12px 32px #0006}.link-main{gap:11px}.link-icon{width:31px;height:31px;border-radius:10px}.link-copy strong{font-size:13px}.link-copy small{font-size:8px}.link-arrow{font-size:16px}
.player{border-radius:18px;background:#080808d9;box-shadow:0 14px 45px #0008}.player-top{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:14px 14px 10px}.play{width:42px;height:42px;border-radius:13px}.track-title{font-size:17px}.track-sub{font-size:8px;letter-spacing:.16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spotify{font-size:8px;letter-spacing:.1em}.wave{height:25px;padding:0 14px}.wave i{animation-duration:1.8s}.progress{grid-template-columns:36px minmax(0,1fr) 36px;gap:7px;padding:3px 14px 9px}.controls{grid-template-columns:1fr;padding:0 14px 13px}.vol{display:none}
.lyrics{padding-inline:10px}.player.expanded{transform:none;border-radius:20px;box-shadow:0 22px 70px #000a}.player.expanded .lyrics{max-height:390px;padding:28px 10px 34px}.player.expanded .lyric{font-size:clamp(28px,8vw,40px);line-height:1.13;min-height:118px;padding:0 4px}
}
@media(pointer:coarse){.links a:hover{transform:none}.links a:active{transform:scale(.985)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
/* Telegram's embedded browser: prioritize stable 60fps rendering over heavy glass effects. */
body.tg-webview .bg-1,body.tg-webview .bg-2{animation:none}body.tg-webview .ash,body.tg-webview .particles{display:none}body.tg-webview .player,body.tg-webview .links a{backdrop-filter:none;-webkit-backdrop-filter:none}body.tg-webview .player{background:#080808e8}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img class="bg-1" src="dark-canopy.jpg"><img class="bg-2" src="mist-forest.jpg"><img class="bg-3" src="black-forest.png"><img class="bg-hood" src="hooded.gif"><div class="mist"></div><div class="ash"></div><div class="particles" id="parts"></div></div>
<main class="page">
<header class="hero"><img class="hero-img" src="fangs.webp" alt=""><div class="hero-fade"></div><div class="hero-name"><span class="cross">†</span><h1>BENZOLA</h1><div class="tagline">fallen · beloved · eternal</div></div></header>
<section class="wrap"><p class="quote">вечность пахнет дымом и снегом</p>
<nav class="links">
<a href="https://www.tiktok.com/@kelli2458?_r=1&_t=ZG-99a2X7MxjEW" target="_blank" rel="noreferrer"><span class="link-main"><span class="link-icon"><svg viewBox="0 0 24 24"><path d="M14.4 4v9.2a4.1 4.1 0 1 1-3.1-4V6.1A7.2 7.2 0 1 0 17.5 4z"/><path d="M14.4 4c.5 2.2 1.8 3.6 4.1 4"/></svg></span><span class="link-copy"><small>01</small><strong>TikTok</strong></span></span><span class="link-arrow">↗</span></a>
<a href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer"><span class="link-main"><span class="link-icon"><svg viewBox="0 0 24 24"><path d="m21 4-3.2 16-5.1-4.1-3 2.9.3-4.6L18.5 7l-9.1 5.6-4.2-1.5z"/></svg></span><span class="link-copy"><small>02</small><strong>Telegram</strong></span></span><span class="link-arrow">↗</span></a>
</nav>
<section class="player" id="player">
<audio id="audio" preload="metadata" playsinline src="Every-Time.mp3"></audio>
<div class="player-top"><button class="play" id="play" type="button" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13L19 12z"/></svg></button><div><div class="track-title">Every Time</div><div class="track-sub">Every Time · Benzola</div></div><a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">Spotify ↗</a></div>
<div class="wave" id="wave"></div>
<div class="progress"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step=".1"><span id="dur">0:00</span></div>
<div class="controls"><div></div><label class="vol"><span>⌁</span><input id="volume" type="range" min="0" max="1" value=".85" step=".01"></label></div>
<div class="lyrics"><div class="lyric" id="lyric">…</div></div>
</section><div class="footer">† eternal</div></section></main>
<script>
(function(){
const ua=navigator.userAgent||'';
const isTelegram=/Telegram/i.test(ua)||!!window.TelegramWebviewProxy;
if(isTelegram)document.body.classList.add('tg-webview');
const audio=document.getElementById('audio'),play=document.getElementById('play'),playIcon=document.getElementById('playIcon'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),lyric=document.getElementById('lyric'),player=document.getElementById('player'),wave=document.getElementById('wave'),parts=document.getElementById('parts');
const bars=isTelegram||matchMedia('(max-width:600px)').matches?26:40;
for(let i=0;i<bars;i++){const b=document.createElement('i');b.style.setProperty('--h',18+Math.random()*82+'%');b.style.setProperty('--d',.65+Math.random()*1.1+'s');b.style.animationDelay=-Math.random()*1.4+'s';wave.appendChild(b)}
if(!isTelegram&&!matchMedia('(max-width:600px)').matches){for(let i=0;i<12;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.animationDuration=14+Math.random()*14+'s';p.style.animationDelay=-Math.random()*14+'s';parts.appendChild(p)}}
const L=[
{t:0,s:'…'},{t:3.9,s:'Мне крутит голову прокуренный быт'},{t:6.65,s:'Ком лезет из горла'},{t:8.2,s:'Я твой невроз, социальная травма'},{t:10.85,s:'Удары, порезы без повода'},{t:12.55,s:'Мутная грязь'},{t:14,s:'Среда обитания, нам с тобою комфортная'},{t:17.1,s:'Память насилует мозг'},{t:18.75,s:'Я снова даю дешёвое слово'},{t:21.35,s:'Мёртвое тело, сгнившее нутро'},{t:25.15,s:'Меня тащит на панельный или тащит на притон'},{t:29.55,s:'Я шагаю, шагаю, шагаю хуй пойми на чём'},{t:33.95,s:'Может быть, о лучшей жизни завтра мне приснится сон'},{t:38.7,s:'О, мой Бог курит боль и колется ночами'},{t:43.5,s:'Кремируй вечный покой, ведь счастье за горами'},{t:47.55,s:'Моя муза блюёт кровавыми кишками'},{t:52.45,s:'Я убит и разлагаюсь под твои печали'},{t:56.05,s:'О, мой Бог курит боль и колется ночами'},{t:61,s:'Кремируй вечный покой, ведь счастье за горами'},{t:64.95,s:'Моя муза блюёт кровавыми кишками'},{t:69.75,s:'Я убит и разлагаюсь под твои печали'},{t:74,s:'…'}];
let current=-1;
const fmt=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')};
function show(i){if(i===current)return;current=i;lyric.classList.remove('active');void lyric.offsetWidth;lyric.textContent=L[i]?L[i].s:'…';lyric.classList.add('active')}
function setPlaying(on){document.body.classList.toggle('is-playing',on);player.classList.toggle('expanded',on);playIcon.innerHTML=on?'<path d="M7 6h3v12H7zM14 6h3v12h-3z"/>':'<path d="M8 5.5v13L19 12z"/>';play.setAttribute('aria-label',on?'Pause':'Play')}
function togglePlay(){if(audio.paused){const p=audio.play();if(p&&p.catch)p.catch(()=>setPlaying(false));else setPlaying(true)}else audio.pause()}
play.addEventListener('click',togglePlay);audio.addEventListener('play',()=>setPlaying(true));audio.addEventListener('pause',()=>setPlaying(false));audio.addEventListener('loadedmetadata',()=>dur.textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{cur.textContent=fmt(audio.currentTime);if(audio.duration)seek.value=audio.currentTime/audio.duration*100;let i=0;for(let n=0;n<L.length;n++)if(L[n].t<=audio.currentTime)i=n;show(i)});audio.addEventListener('ended',()=>{setPlaying(false);seek.value=0;show(0)});seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});volume.addEventListener('input',()=>audio.volume=+volume.value);audio.volume=.85;show(0);
})();
</script>
