<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benzola</title>
  <meta name="description" content="Benzola · dark bio" />
  <meta property="og:title" content="Benzola" />
  <meta property="og:description" content="вечность пахнет дымом и снегом" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #030303;
      --bg: #070708;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text: #e4e2de;
      --text-dim: #8a8680;
      --text-ghost: #55524e;
      --blood: #6e1515;
      --blood-bright: #a81818;
      --bone: #d0ccc5;
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Manrope", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--void);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body { overflow-x: hidden; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }

    @keyframes breathe {
      0%, 100% { transform: scale(1.03); }
      50% { transform: scale(1.07); }
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(-3%, 2%, 0); opacity: 0.2; }
      50% { transform: translate3d(4%, -3%, 0); opacity: 0.38; }
    }
    @keyframes rain {
      from { background-position: 0 -120vh; }
      to { background-position: 18px 120vh; }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.18; filter: blur(14px); }
      50% { opacity: 0.4; filter: blur(8px); }
    }
    @keyframes lyric-in {
      0% { opacity: 0; transform: translateY(18px) scale(0.96); filter: blur(8px); }
      55% { opacity: 1; filter: blur(0); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes slash {
      0%, 72%, 100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
      76% { clip-path: inset(40% 0 40% 0); transform: translateX(-4px); }
      80% { clip-path: inset(12% 0 60% 0); transform: translateX(5px); }
      86% { clip-path: inset(70% 0 8% 0); transform: translateX(-2px); }
    }
    @keyframes wave {
      0%, 100% { height: 12%; }
      50% { height: var(--bar); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes name-in {
      from { opacity: 0; transform: translateY(12px); letter-spacing: 0.35em; }
      to { opacity: 1; transform: translateY(0); letter-spacing: 0.22em; }
    }
    @keyframes name-glow {
      0%, 100% { text-shadow: 0 2px 24px rgba(0,0,0,0.95), 0 0 40px rgba(0,0,0,0.6); }
      50% { text-shadow: 0 2px 24px rgba(0,0,0,0.95), 0 0 48px rgba(168,24,24,0.18); }
    }
    @keyframes particle {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      12% { opacity: 0.5; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-100vh) scale(0.35); opacity: 0; }
    }
    @keyframes sigil-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes hero-breathe {
      0%, 100% { transform: scale(1.04); }
      50% { transform: scale(1.09); }
    }
    @keyframes tree-sway {
      0%, 100% { transform: translateX(0) scale(1.02); }
      50% { transform: translateX(1.5%) scale(1.04); }
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      isolation: isolate;
      overflow-x: hidden;
    }

    /* ═══════════ FIXED FULL-PAGE SCENE ═══════════ */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #050505;
      overflow: hidden;
      pointer-events: none;
    }
    .scene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* deep canopy — main visible forest */
    .layer-canopy {
      opacity: 0.72;
      filter: grayscale(1) contrast(1.35) brightness(0.42);
      animation: breathe 28s ease-in-out infinite;
      transform-origin: center 25%;
    }

    /* mist forest — soft depth */
    .layer-mist {
      opacity: 0.45;
      filter: grayscale(1) contrast(1.15) brightness(0.5);
      mix-blend-mode: soft-light;
    }

    /* black forest — denser lower/mid texture */
    .layer-forest {
      opacity: 0.38;
      filter: grayscale(1) contrast(1.45) brightness(0.35);
      mix-blend-mode: multiply;
    }

    /* crimson tree — right atmospheric accent */
    .layer-tree {
      opacity: 0.22;
      filter: grayscale(0.55) saturate(0.4) contrast(1.3) brightness(0.5);
      mix-blend-mode: screen;
      clip-path: polygon(38% 0, 100% 0, 100% 75%, 55% 62%);
      mask-image: linear-gradient(to bottom, black 35%, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, black 35%, transparent 92%);
      animation: tree-sway 22s ease-in-out infinite;
    }

    /* blood river — bottom left flow */
    .layer-river {
      opacity: 0.28;
      filter: grayscale(0.7) contrast(1.7) brightness(0.42) hue-rotate(-6deg);
      mix-blend-mode: screen;
      clip-path: polygon(0 48%, 45% 55%, 58% 100%, 0 100%);
      mask-image: linear-gradient(to top, black 25%, transparent 85%);
      -webkit-mask-image: linear-gradient(to top, black 25%, transparent 85%);
    }

    /* hooded figure — distant silhouette, very subtle */
    .layer-hood {
      opacity: 0.12;
      filter: grayscale(1) contrast(1.4) brightness(0.3);
      mix-blend-mode: soft-light;
      object-position: center 60%;
      mask-image: radial-gradient(ellipse 70% 80% at 50% 70%, black 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 70%, black 20%, transparent 75%);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 90% at 50% 42%, transparent 0%, transparent 30%, rgba(3,3,3,0.35) 65%, rgba(3,3,3,0.75) 100%),
        linear-gradient(180deg, rgba(3,3,3,0.2) 0%, transparent 15%, transparent 55%, rgba(3,3,3,0.55) 100%);
      pointer-events: none;
    }

    .mist {
      position: absolute;
      left: -25%;
      right: -25%;
      bottom: 6%;
      height: 28%;
      background: radial-gradient(ellipse, rgba(190,185,175,0.2), transparent 68%);
      filter: blur(36px);
      animation: drift 14s ease-in-out infinite;
      pointer-events: none;
    }
    .mist-2 {
      bottom: 38%;
      height: 16%;
      opacity: 0.55;
      animation-delay: -7s;
      animation-duration: 19s;
    }

    .ash {
      position: absolute;
      inset: 0;
      opacity: 0.1;
      background-image: repeating-linear-gradient(
        96deg,
        transparent 0 55px,
        rgba(160,160,160,0.45) 56px 57px,
        transparent 58px 105px
      );
      background-size: 120px 180vh;
      transform: rotate(6deg) scale(1.25);
      animation: rain 11s linear infinite;
      pointer-events: none;
    }

    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particles span {
      position: absolute;
      bottom: -8px;
      background: rgba(180,180,180,0.45);
      border-radius: 50%;
      animation: particle linear infinite;
    }

    /* ═══════════ HERO ═══════════ */
    .hero {
      position: relative;
      z-index: 2;
      width: 100%;
      height: min(40vh, 360px);
      min-height: 220px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      filter: grayscale(0.88) contrast(1.3) brightness(0.5);
      animation: hero-breathe 20s ease-in-out infinite;
      transform-origin: center 40%;
    }
    .hero-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(3,3,3,0.15) 0%,
          transparent 20%,
          transparent 40%,
          rgba(3,3,3,0.45) 68%,
          rgba(3,3,3,0.88) 88%,
          transparent 100%
        ),
        radial-gradient(ellipse 95% 75% at 50% 35%, transparent 0%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }
    .hero-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16%;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
    }
    .hero-name .sigil {
      display: block;
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--blood-bright);
      line-height: 1;
      margin-bottom: 6px;
      animation: sigil-pulse 4s ease-in-out infinite;
      text-shadow: 0 0 22px rgba(168,24,24,0.5);
    }
    .hero-name h1 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(42px, 11vw, 72px);
      letter-spacing: 0.22em;
      color: var(--bone);
      line-height: 1;
      animation: name-in 1.4s ease-out both, name-glow 5s ease-in-out 1.4s infinite;
    }

    /* ═══════════ CONTENT ═══════════ */
    .shell {
      position: relative;
      z-index: 2;
      width: min(100%, 400px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 4px 20px 48px;
      margin-top: -24px;
    }

    .bio-meta {
      text-align: center;
      animation: fade-up 1s 0.2s ease-out both;
    }
    .eyebrow {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .motto {
      font-family: var(--font-display);
      font-size: 15px;
      font-style: italic;
      color: rgba(208,204,197,0.55);
      letter-spacing: 0.02em;
      text-shadow: 0 1px 10px rgba(0,0,0,0.7);
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      animation: fade-up 1s 0.3s ease-out both;
    }
    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(14,14,16,0.72), rgba(10,10,12,0.58));
      color: var(--text);
      text-decoration: none;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 25%, rgba(168,24,24,0.08), transparent 75%);
      opacity: 0;
      transition: opacity 0.35s;
    }
    .link:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    .link:hover::before { opacity: 1; }
    .link-inner {
      display: flex;
      align-items: center;
      gap: 9px;
      position: relative;
      z-index: 1;
    }
    .link-num {
      font-size: 8px;
      font-weight: 500;
      color: var(--text-ghost);
      letter-spacing: 0.06em;
    }
    .link-label {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .link svg {
      width: 14px;
      height: 14px;
      opacity: 0.4;
      transition: opacity 0.25s, transform 0.25s;
      position: relative;
      z-index: 1;
    }
    .link:hover svg {
      opacity: 0.85;
      transform: translate(1px, -1px);
    }

    .player {
      width: 100%;
      position: relative;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(165deg, rgba(12,12,14,0.78), rgba(8,8,10,0.7));
      box-shadow: 0 22px 55px rgba(0,0,0,0.55), inset 0 1px rgba(255,255,255,0.04);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      overflow: hidden;
      transition: border-color 0.45s, box-shadow 0.45s;
      animation: fade-up 1s 0.4s ease-out both;
    }
    .player.is-playing {
      border-color: rgba(168,24,24,0.28);
      box-shadow: 0 22px 55px rgba(0,0,0,0.55), 0 0 30px rgba(168,24,24,0.06), inset 0 1px rgba(255,255,255,0.04);
    }
    .player-glow {
      position: absolute;
      top: -5px;
      left: 20%;
      width: 60%;
      height: 8px;
      border-radius: 50%;
      background: var(--blood-bright);
      opacity: 0.14;
      filter: blur(10px);
      pointer-events: none;
    }
    .player.is-playing .player-glow {
      animation: pulse-soft 2.5s ease-in-out infinite;
    }

    .player-top {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 11px;
      align-items: center;
      padding: 11px 11px 8px;
    }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(208,204,197,0.28);
      background: var(--bone);
      color: var(--void);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.3s;
    }
    .play-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 22px rgba(168,24,24,0.3);
    }
    .play-btn svg { width: 17px; height: 17px; }
    .play-offset { transform: translateX(1.5px); }

    .track-meta {
      min-width: 0;
      display: grid;
      gap: 5px;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .track-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .track-title svg {
      width: 11px;
      height: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .track-title strong {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 400;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spotify {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-ghost);
      text-decoration: none;
      transition: color 0.25s;
      flex-shrink: 0;
    }
    .spotify:hover { color: var(--bone); }
    .spotify svg { width: 9px; height: 9px; }

    .seek {
      --progress: 0%;
      width: 100%;
      height: 2.5px;
      appearance: none;
      border-radius: 2px;
      background: linear-gradient(to right, var(--blood-bright) var(--progress), rgba(255,255,255,0.1) var(--progress));
      cursor: pointer;
    }
    .seek::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 10px rgba(168,24,24,0.4);
      cursor: pointer;
    }
    .seek::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 50%;
      background: var(--bone);
      box-shadow: 0 0 10px rgba(168,24,24,0.4);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
    }
    .time-row time {
      font-size: 8px;
      color: var(--text-ghost);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }

    .vol {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 2px;
    }
    .vol svg {
      width: 13px;
      height: 13px;
      color: var(--text-ghost);
    }
    .vol input {
      width: 48px;
      accent-color: var(--blood-bright);
      cursor: pointer;
    }

    .lyrics-wrap {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.8s cubic-bezier(0.22, 0.8, 0.22, 1), opacity 0.4s ease;
    }
    .player.is-playing .lyrics-wrap {
      max-height: 220px;
      opacity: 1;
    }

    .lyric-stage {
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 12px 14px 4px;
      overflow: hidden;
    }
    .lyric-active {
      margin: 5px 0;
      max-width: 100%;
      font-family: var(--font-display);
      font-size: clamp(19px, 5.2vw, 28px);
      font-style: italic;
      font-weight: 300;
      line-height: 1.1;
      color: var(--bone);
      text-shadow: 0 0 18px rgba(0,0,0,0.6);
      animation: lyric-in 0.5s cubic-bezier(0.2, 0.85, 0.2, 1) both;
    }
    .lyric-ghost {
      margin: 0;
      max-width: 90%;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-ghost);
      opacity: 0.55;
    }
    .lyric-cut {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px 14px;
      pointer-events: none;
      font-family: var(--font-display);
      font-size: clamp(19px, 5.2vw, 28px);
      font-style: italic;
      color: var(--blood-bright);
      opacity: 0.35;
      animation: slash 5s steps(1) infinite;
    }

    .waveform {
      height: 24px;
      display: flex;
      align-items: center;
      gap: 2.5px;
      padding: 0 14px 12px;
      opacity: 0.4;
    }
    .waveform i {
      display: block;
      flex: 1;
      height: 10%;
      min-width: 2px;
      border-radius: 2px;
      background: linear-gradient(to top, rgba(168,24,24,0.55), var(--bone));
    }
    .player.is-playing .waveform i {
      animation: wave 0.6s ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .footer {
      position: relative;
      z-index: 2;
      padding: 0 0 18px;
      text-align: center;
      font-size: 7px;
      letter-spacing: 0.3em;
      color: rgba(170,166,160,0.25);
    }

    @media (max-width: 520px) {
      .hero {
        height: min(34vh, 280px);
        min-height: 190px;
      }
      .hero-name { bottom: 14%; }
      .hero-name h1 {
        font-size: clamp(34px, 11vw, 50px);
        letter-spacing: 0.16em;
      }
      .shell {
        padding: 0 14px 40px;
        margin-top: -18px;
      }
      .vol { display: none; }
      .player-top { grid-template-columns: 46px 1fr; }
      .links { gap: 8px; }
      .link { height: 48px; padding: 0 14px; }
      .layer-tree { opacity: 0.16; }
      .layer-hood { opacity: 0.08; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- Fixed layered background (always visible) -->
    <div class="scene" aria-hidden="true">
      <img class="layer-canopy" src="dark-canopy.jpg" alt="" />
      <img class="layer-mist" src="mist-forest.jpg" alt="" />
      <img class="layer-forest" src="black-forest.png" alt="" />
      <img class="layer-tree" src="crimson-tree.webp" alt="" />
      <img class="layer-river" src="winter-river.png" alt="" />
      <img class="layer-hood" src="hooded.gif" alt="" />
      <div class="vignette"></div>
      <div class="mist"></div>
      <div class="mist mist-2"></div>
      <div class="ash"></div>
      <div class="particles" id="particles"></div>
    </div>

    <!-- Hero: fangs + Benzola -->
    <header class="hero">
      <img class="hero-img" src="fangs.webp" alt="" />
      <div class="hero-shade"></div>
      <div class="hero-name">
        <span class="sigil">†</span>
        <h1>BENZOLA</h1>
      </div>
    </header>

    <div class="shell">
      <div class="bio-meta">
        <p class="eyebrow">fallen · beloved · eternal</p>
        <p class="motto">вечность пахнет дымом и снегом</p>
      </div>

      <nav class="links" aria-label="Links">
        <a class="link" href="https://www.tiktok.com/@kelli2458?_r=1&_t=ZG-99a2X7MxjEW" target="_blank" rel="noreferrer">
          <span class="link-inner">
            <span class="link-num">01</span>
            <span class="link-label">TikTok</span>
          </span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
        <a class="link" href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer">
          <span class="link-inner">
            <span class="link-num">02</span>
            <span class="link-label">Telegram</span>
          </span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </nav>

      <section class="player" id="player" aria-label="Music player">
        <div class="player-glow"></div>
        <audio id="audio" src="Every-Time.mp3" preload="metadata"></audio>

        <div class="player-top">
          <button class="play-btn" id="playBtn" aria-label="Play">
            <svg id="iconPlay" class="play-offset" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="iconPause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>

          <div class="track-meta">
            <div class="track-row">
              <div class="track-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <strong>Every Time</strong>
              </div>
              <a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">
                Spotify
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
            <input class="seek" id="seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="Position" />
            <div class="time-row">
              <time id="tCurrent">0:00</time>
              <time id="tDuration">0:00</time>
            </div>
          </div>

          <div class="vol">
            <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="0.85" aria-label="Volume" />
          </div>
        </div>

        <div class="lyrics-wrap">
          <div class="lyric-stage" aria-live="polite">
            <p class="lyric-ghost" id="lBefore"></p>
            <p class="lyric-active" id="lActive"></p>
            <p class="lyric-ghost" id="lAfter"></p>
            <div class="lyric-cut" id="lCut" aria-hidden="true"></div>
          </div>
          <div class="waveform" id="waveform" aria-hidden="true"></div>
        </div>
      </section>
    </div>

    <p class="footer">BENZOLA · IX · MMXXVI</p>
  </main>

  <script>
    const timedLyrics = [
      { t: 0.0,   text: "…" },
      { t: 4.28,  text: "Мне крутит голову прокуренный быт" },
      { t: 7.03,  text: "Ком лезет из горла" },
      { t: 8.58,  text: "Я твой невроз, социальная травма" },
      { t: 11.25, text: "Удары, порезы без повода" },
      { t: 12.93, text: "Мутная грязь" },
      { t: 14.37, text: "Среда обитания, нам с тобою комфортная" },
      { t: 17.47, text: "Память насилует мозг" },
      { t: 19.15, text: "Я снова даю дешёвое слово" },
      { t: 21.76, text: "Мёртвое тело, сгнившее нутро" },
      { t: 25.56, text: "Меня тащит на панельный или тащит на притон" },
      { t: 29.95, text: "Я шагаю, шагаю, шагаю хуй пойми на чём" },
      { t: 34.36, text: "Может быть, о лучшей жизни завтра мне приснится сон" },
      { t: 39.12, text: "О, мой Бог курит боль и колется ночами" },
      { t: 43.89, text: "Кремируй вечный покой, ведь счастье за горами" },
      { t: 47.93, text: "Моя муза блюёт кровавыми кишками" },
      { t: 52.85, text: "Я убит и разлагаюсь под твои печали" },
      { t: 56.44, text: "О, мой Бог курит боль и колется ночами" },
      { t: 61.38, text: "Кремируй вечный покой, ведь счастье за горами" },
      { t: 65.33, text: "Моя муза блюёт кровавыми кишками" },
      { t: 70.12, text: "Я убит и разлагаюсь под твои печали" },
      { t: 74.04, text: "…" }
    ];

    const audio = document.getElementById('audio');
    const player = document.getElementById('player');
    const playBtn = document.getElementById('playBtn');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const seek = document.getElementById('seek');
    const tCurrent = document.getElementById('tCurrent');
    const tDuration = document.getElementById('tDuration');
    const volume = document.getElementById('volume');
    const volIcon = document.getElementById('volIcon');
    const lBefore = document.getElementById('lBefore');
    const lActive = document.getElementById('lActive');
    const lAfter = document.getElementById('lAfter');
    const lCut = document.getElementById('lCut');
    const waveform = document.getElementById('waveform');

    for (let i = 0; i < 44; i++) {
      const bar = document.createElement('i');
      bar.style.setProperty('--bar', `${14 + ((i * 39) % 80)}%`);
      bar.style.setProperty('--delay', `${i * -0.04}s`);
      waveform.appendChild(bar);
    }

    const particles = document.getElementById('particles');
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      s.style.left = `${Math.random() * 100}%`;
      s.style.animationDuration = `${10 + Math.random() * 14}s`;
      s.style.animationDelay = `${Math.random() * 11}s`;
      s.style.width = s.style.height = `${1 + Math.random() * 2.2}px`;
      particles.appendChild(s);
    }

    function fmt(v) {
      if (!Number.isFinite(v)) return '0:00';
      return `${Math.floor(v / 60)}:${Math.floor(v % 60).toString().padStart(2, '0')}`;
    }

    let lastIndex = -1;

    function getLyricIndex(time) {
      let idx = 0;
      for (let i = 0; i < timedLyrics.length; i++) {
        if (time >= timedLyrics[i].t) idx = i;
        else break;
      }
      return idx;
    }

    function updateLyrics(time) {
      const idx = getLyricIndex(time);
      if (idx === lastIndex) return;
      lastIndex = idx;
      const prev = timedLyrics[idx - 1];
      const curr = timedLyrics[idx];
      const next = timedLyrics[idx + 1];
      lBefore.textContent = prev ? prev.text : '';
      lActive.textContent = curr ? curr.text : '';
      lAfter.textContent = next ? next.text : '';
      lCut.textContent = curr ? curr.text : '';
      lActive.style.animation = 'none';
      void lActive.offsetWidth;
      lActive.style.animation = '';
    }

    function setPlaying(on) {
      player.classList.toggle('is-playing', on);
      iconPlay.style.display = on ? 'none' : 'block';
      iconPause.style.display = on ? 'block' : 'none';
      playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    }

    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); } catch (e) {}
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    audio.addEventListener('ended', () => setPlaying(false));

    audio.addEventListener('loadedmetadata', () => {
      seek.max = audio.duration;
      tDuration.textContent = fmt(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const t = audio.currentTime;
      seek.value = t;
      seek.style.setProperty('--progress', `${(t / (audio.duration || 1)) * 100}%`);
      tCurrent.textContent = fmt(t);
      updateLyrics(t);
    });

    seek.addEventListener('input', () => {
      const v = Number(seek.value);
      audio.currentTime = v;
      tCurrent.textContent = fmt(v);
      lastIndex = -1;
      updateLyrics(v);
    });

    volume.addEventListener('input', () => {
      const v = Number(volume.value);
      audio.volume = v;
      if (v === 0) {
        volIcon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
      } else {
        volIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
      }
    });

    audio.volume = 0.85;
    updateLyrics(0);
  </script>
</body>
</html>
