<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020202" />
  <title>Benzola</title>
  <meta name="description" content="Benzola · dark bio" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --void:#020202;
      --text:#e6e4e0;
      --text-dim:#9a9690;
      --text-ghost:#5c5954;
      --blood:#a81818;
      --bone:#d2cec7;
      --font-d:"Cormorant Garamond",Georgia,serif;
      --font-s:"Manrope",system-ui,sans-serif;
      --mx:50%;
      --my:50%;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:#000;color:var(--text);font-family:var(--font-s);-webkit-font-smoothing:antialiased}
    body{overflow-x:hidden}
    a,button,input{-webkit-tap-highlight-color:transparent}
    img{display:block}
    button,input{font:inherit}

    /* =========================================================
       CINEMATIC MOTION
       ========================================================= */
    @keyframes breathe{0%,100%{transform:scale(1.02)}50%{transform:scale(1.075)}}
    @keyframes slowBreathe{0%,100%{transform:scale(1.015);opacity:.72}50%{transform:scale(1.045);opacity:.9}}
    @keyframes drift{0%,100%{transform:translate(-2%,0) scale(1);opacity:.18}50%{transform:translate(3%,-2%) scale(1.05);opacity:.4}}
    @keyframes driftReverse{0%,100%{transform:translate(3%,1%) scale(1.02);opacity:.14}50%{transform:translate(-4%,-1%) scale(1.08);opacity:.32}}
    @keyframes rain{from{background-position:0 -100vh}to{background-position:18px 100vh}}
    @keyframes hoodPulse{0%,100%{opacity:.48;transform:scale(1.015);filter:grayscale(1) contrast(1.4) brightness(.46)}50%{opacity:.64;transform:scale(1.045);filter:grayscale(1) contrast(1.5) brightness(.54)}}
    @keyframes hoodGlow{0%,100%{opacity:.07;transform:translateX(-50%) scale(.94)}50%{opacity:.2;transform:translateX(-50%) scale(1.05)}}
    @keyframes lyricIn{0%{opacity:0;transform:translateY(22px) scale(.96);filter:blur(9px)}55%{opacity:1;filter:blur(0)}100%{transform:translateY(0) scale(1)}}
    @keyframes wave{0%,100%{height:12%}50%{height:var(--h)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes nameIn{0%{opacity:0;letter-spacing:.5em;transform:translateY(18px) scale(.96);filter:blur(12px)}48%{opacity:.62;filter:blur(4px)}76%{opacity:1;filter:blur(0)}100%{opacity:1;letter-spacing:.2em;transform:translateY(0) scale(1);filter:blur(0)}}
    @keyframes nameGlow{0%,100%{text-shadow:0 2px 22px #000,0 0 35px rgba(0,0,0,.9),0 0 0 rgba(168,24,24,0)}45%{text-shadow:0 2px 22px #000,0 0 44px rgba(0,0,0,.9),0 0 24px rgba(168,24,24,.18)}50%{text-shadow:0 2px 22px #000,0 0 52px rgba(0,0,0,.9),0 0 48px rgba(168,24,24,.32)}58%{text-shadow:0 2px 22px #000,0 0 42px rgba(0,0,0,.9),0 0 24px rgba(168,24,24,.14)}}
    @keyframes nameFlicker{0%,91%,100%{opacity:1;filter:none}92%{opacity:.84;filter:blur(.5px)}93%{opacity:1;filter:none}95%{opacity:.9;filter:blur(.3px)}96%{opacity:1}}
    @keyframes ghostDrift{0%,100%{transform:translate(0,0);opacity:.07}50%{transform:translate(2px,-1px);opacity:.16}}
    @keyframes sigil{0%,100%{opacity:.45;transform:scale(1) translateY(0)}50%{opacity:.95;transform:scale(1.1) translateY(-1px)}}
    @keyframes floatP{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.5}100%{transform:translateY(-110vh) translateX(35px);opacity:0}}
    @keyframes buttonIn{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
    @keyframes borderSpin{to{--angle:360deg}}
    @keyframes shine{0%{transform:translateX(-130%) rotate(12deg);opacity:0}18%{opacity:.55}45%{opacity:0}100%{transform:translateX(230%) rotate(12deg);opacity:0}}
    @keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(168,24,24,0)}50%{box-shadow:0 0 0 6px rgba(168,24,24,.08)}}
    @property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}

    /* =========================================================
       ATMOSPHERE
       ========================================================= */
    .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 65%,#111 0%,#050505 45%,#000 100%)}
    .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform,opacity}
    .bg-1{opacity:.78;filter:grayscale(1) contrast(1.3) brightness(.5);animation:breathe 30s ease-in-out infinite;transform-origin:center 35%}
    .bg-2{opacity:.44;filter:grayscale(1) contrast(1.18) brightness(.55) blur(.2px);mix-blend-mode:screen;animation:slowBreathe 34s ease-in-out infinite}
    .bg-3{opacity:.3;filter:grayscale(1) contrast(1.4) brightness(.36);mix-blend-mode:multiply;animation:breathe 40s ease-in-out infinite reverse}

    .bg-hood{opacity:.5;filter:grayscale(1) contrast(1.4) brightness(.46);mix-blend-mode:screen;object-position:center 72%;object-fit:cover;animation:hoodPulse 9s ease-in-out infinite;mask-image:radial-gradient(ellipse 72% 70% at 50% 72%,#000 0%,#000 38%,rgba(0,0,0,.8) 55%,transparent 82%);-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 72%,#000 0%,#000 38%,rgba(0,0,0,.8) 55%,transparent 82%)}

    .bg::before{content:"";position:absolute;left:50%;bottom:1%;width:78%;height:62%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(210,206,199,.14) 0%,rgba(168,24,24,.065) 25%,transparent 70%);filter:blur(48px);opacity:.22;animation:hoodGlow 9s ease-in-out infinite;z-index:2}
    .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 65% 75% at 50% 68%,transparent 18%,rgba(0,0,0,.2) 68%,rgba(0,0,0,.72) 100%);z-index:5}
    .bg-vignette{position:absolute;inset:0;z-index:6;background:radial-gradient(ellipse 95% 85% at 50% 42%,transparent 8%,rgba(0,0,0,.16) 50%,rgba(0,0,0,.68) 100%),linear-gradient(180deg,rgba(0,0,0,.1),transparent 18%,transparent 52%,rgba(0,0,0,.25) 78%,rgba(0,0,0,.65))}
    .bg-mist{position:absolute;left:-20%;right:-20%;bottom:4%;height:32%;z-index:7;background:radial-gradient(ellipse,rgba(210,205,195,.2),transparent 70%);filter:blur(40px);animation:drift 13s ease-in-out infinite}
    .bg-mist2{bottom:36%;height:16%;opacity:.65;animation-delay:-6s;animation-duration:18s}
    .bg-ash{position:absolute;inset:0;z-index:8;opacity:.08;background-image:repeating-linear-gradient(95deg,transparent 0 52px,rgba(170,170,170,.45) 53px 54px,transparent 55px 105px);background-size:115px 170vh;transform:rotate(6deg) scale(1.25);animation:rain 11s linear infinite}
    .bg-particles{position:absolute;inset:0;overflow:hidden;z-index:9}
    .bg-particles i{position:absolute;bottom:-6px;width:2px;height:2px;background:rgba(190,190,190,.45);border-radius:50%;animation:floatP linear infinite}

    /* =========================================================
       PAGE / HERO
       ========================================================= */
    .page{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;align-items:center}

    .hero{width:100%;height:min(47vh,430px);min-height:245px;position:relative;flex-shrink:0;isolation:isolate;overflow:visible}

    /* The image extends beyond the hero and dissolves with a large
       feathered mask. This removes the old visible horizontal seam. */
    .hero-img{position:absolute;z-index:1;left:50%;top:-1%;width:100%;height:125%;object-fit:cover;object-position:center top;transform:translateX(-50%) scale(1.035);filter:grayscale(.78) contrast(1.12) brightness(.72);will-change:transform,opacity;animation:heroBreath 22s ease-in-out infinite;mask-image:linear-gradient(to bottom,#000 0%,#000 38%,rgba(0,0,0,.98) 47%,rgba(0,0,0,.78) 58%,rgba(0,0,0,.42) 69%,rgba(0,0,0,.16) 80%,transparent 94%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 38%,rgba(0,0,0,.98) 47%,rgba(0,0,0,.78) 58%,rgba(0,0,0,.42) 69%,rgba(0,0,0,.16) 80%,transparent 94%)}
    @keyframes heroBreath{0%,100%{transform:translateX(-50%) scale(1.035)}50%{transform:translateX(-50%) scale(1.065)}}

    /* Wide blurred duplicate underneath the real image. It fills the
       transition zone with the image's own light and texture. */
    .hero::before{content:"";position:absolute;z-index:0;left:-10%;right:-10%;top:26%;height:90%;background:url('fangs.webp') center top/cover no-repeat;filter:grayscale(.8) contrast(1.05) brightness(.55) blur(34px);opacity:.42;transform:scale(1.08);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.95) 32%,rgba(0,0,0,.72) 54%,rgba(0,0,0,.3) 76%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.95) 32%,rgba(0,0,0,.72) 54%,rgba(0,0,0,.3) 76%,transparent 100%)}

    /* Atmospheric feather layers. None has a hard edge; together they
       create a deep dissolve instead of a line. */
    .hero::after{content:"";position:absolute;z-index:2;left:-15%;right:-15%;bottom:-7%;height:58%;background:radial-gradient(ellipse 62% 55% at 50% 0%,rgba(0,0,0,0) 0%,rgba(0,0,0,.08) 32%,rgba(0,0,0,.5) 69%,#020202 100%);filter:blur(18px);pointer-events:none}

    .hero-fade{position:absolute;z-index:3;inset:0;pointer-events:none;background:radial-gradient(ellipse 95% 72% at 50% 16%,transparent 22%,rgba(0,0,0,.08) 52%,rgba(0,0,0,.52) 100%)}
    .hero-bridge{position:absolute;z-index:4;left:-18%;right:-18%;bottom:-8%;height:52%;pointer-events:none;background:radial-gradient(ellipse 48% 70% at 50% 5%,rgba(8,8,8,.03) 0%,rgba(3,3,3,.28) 45%,rgba(2,2,2,.72) 78%,#020202 100%);filter:blur(24px)}

    .hero-name{position:absolute;z-index:8;left:50%;bottom:20%;transform:translateX(-50%);text-align:center;width:min(92%,900px);pointer-events:none}
    .hero-name::before{content:"BENZOLA";position:absolute;inset:0;font:300 clamp(42px,8vw,78px)/1 var(--font-d);letter-spacing:.2em;color:rgba(168,24,24,.2);transform:translate(4px,2px);filter:blur(3px);animation:ghostDrift 5.5s ease-in-out infinite}
    .cross{display:block;margin-bottom:2px;color:var(--blood);font:300 clamp(20px,3vw,28px)/1 var(--font-d);animation:sigil 4s ease-in-out infinite}
    .hero-name h1{position:relative;font:300 clamp(42px,8vw,78px)/.95 var(--font-d);letter-spacing:.2em;color:var(--bone);animation:nameIn 1.7s cubic-bezier(.16,1,.3,1) both,nameGlow 6s ease-in-out 1.5s infinite,nameFlicker 8s steps(1,end) 3s infinite}
    .tagline{margin-top:15px;color:rgba(230,228,224,.62);font:300 11px/1.4 var(--font-s);letter-spacing:.42em;text-transform:lowercase;animation:fadeUp 1.1s .75s both}

    /* =========================================================
       CONTENT
       ========================================================= */
    .wrap{width:min(720px,calc(100% - 34px));margin-top:-34px;position:relative;z-index:20;padding-bottom:48px}
    .quote{text-align:center;color:rgba(230,228,224,.72);font:italic 300 clamp(18px,3vw,24px)/1.3 var(--font-d);margin:0 0 25px;animation:fadeUp 1s 1s both;text-shadow:0 2px 18px #000}

    /* =========================================================
       SOCIAL BUTTONS — GLASS / LIGHT / 3D / RIPPLE
       ========================================================= */
    .links{display:grid;gap:12px;margin-bottom:22px}
    .links a{--rx:0deg;--ry:0deg;position:relative;display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:0 18px 0 20px;border:1px solid rgba(230,228,224,.11);border-radius:18px;color:var(--text);text-decoration:none;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 42%,rgba(255,255,255,.025));backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);box-shadow:0 16px 50px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.4);transform:perspective(900px) rotateX(var(--ry)) rotateY(var(--rx));transition:transform .65s cubic-bezier(.16,1,.3,1),border-color .5s ease,box-shadow .6s ease,background .5s ease;animation:buttonIn .9s cubic-bezier(.16,1,.3,1) both}
    .links a:nth-child(2){animation-delay:.12s}
    .links a::before{content:"";position:absolute;inset:-1px;z-index:-2;border-radius:inherit;background:conic-gradient(from var(--angle),transparent 0deg,rgba(210,206,199,.04) 55deg,rgba(168,24,24,.55) 105deg,transparent 145deg,transparent 260deg,rgba(210,206,199,.14) 310deg,transparent 360deg);opacity:0;transition:opacity .5s ease;animation:borderSpin 5s linear infinite paused}
    .links a::after{content:"";position:absolute;z-index:-1;left:-55%;top:-80%;width:42%;height:260%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);filter:blur(5px);transform:translateX(-130%) rotate(12deg);opacity:0}
    .links a:hover{transform:perspective(900px) rotateX(var(--ry)) rotateY(var(--rx)) translateY(-5px) scale(1.012);border-color:rgba(230,228,224,.25);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.025) 48%,rgba(168,24,24,.035));box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 42px rgba(168,24,24,.08),inset 0 1px 0 rgba(255,255,255,.11),inset 0 -1px 0 rgba(0,0,0,.5)}
    .links a:hover::before{opacity:1;animation-play-state:running}
    .links a:hover::after{opacity:1;animation:shine 1.2s cubic-bezier(.16,1,.3,1) forwards}
    .links a:focus-visible{outline:none;border-color:rgba(230,228,224,.45);box-shadow:0 0 0 3px rgba(230,228,224,.08),0 20px 60px rgba(0,0,0,.45)}

    .link-main{display:flex;align-items:center;gap:14px;min-width:0}
    .link-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(230,228,224,.1);border-radius:11px;background:rgba(255,255,255,.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:transform .55s cubic-bezier(.16,1,.3,1),background .4s ease,border-color .4s ease;animation:iconFloat 4s ease-in-out infinite}
    .link-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s ease}
    .links a:hover .link-icon{transform:translateY(-2px) rotate(-4deg) scale(1.08);background:rgba(168,24,24,.1);border-color:rgba(168,24,24,.28)}
    .links a:hover .link-icon svg{transform:scale(1.06)}
    .link-copy{display:flex;flex-direction:column;gap:3px}
    .link-copy small{color:var(--text-ghost);font-size:9px;letter-spacing:.3em;line-height:1;text-transform:uppercase}
    .link-copy strong{font:500 14px/1 var(--font-s);letter-spacing:.06em}
    .link-arrow{width:32px;height:32px;display:grid;place-items:center;color:rgba(230,228,224,.45);transition:transform .55s cubic-bezier(.16,1,.3,1),color .35s ease}
    .link-arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .links a:hover .link-arrow{transform:translate(4px,-4px);color:var(--bone)}
    .ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.18);transform:scale(0);animation:ripple .7s ease-out forwards}
    @keyframes ripple{to{transform:scale(4);opacity:0}}

    /* =========================================================
       PLAYER
       ========================================================= */
    .player{position:relative;overflow:hidden;border:1px solid rgba(230,228,224,.1);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));backdrop-filter:blur(20px) saturate(115%);-webkit-backdrop-filter:blur(20px) saturate(115%);box-shadow:0 18px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);animation:fadeUp 1s 1.15s both}
    .player::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(168,24,24,.1),transparent 34%);opacity:.8;pointer-events:none}
    .player-top{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:16px 17px 12px}
    .play{width:44px;height:44px;border:1px solid rgba(230,228,224,.15);border-radius:14px;background:rgba(255,255,255,.045);color:var(--bone);display:grid;place-items:center;cursor:pointer;transition:transform .35s ease,background .35s ease,border-color .35s ease}
    .play:hover{transform:scale(1.06);background:rgba(255,255,255,.08);border-color:rgba(230,228,224,.3)}
    .play svg{width:17px;height:17px;fill:currentColor}
    .track-title{font:400 18px/1 var(--font-d);letter-spacing:.03em}
    .track-sub{margin-top:4px;color:var(--text-ghost);font-size:9px;letter-spacing:.22em;text-transform:uppercase}
    .spotify{color:rgba(230,228,224,.42);text-decoration:none;font-size:9px;letter-spacing:.18em;text-transform:uppercase;transition:color .3s ease}
    .spotify:hover{color:var(--bone)}
    .wave{height:32px;display:flex;align-items:center;gap:2px;padding:0 17px;opacity:.58}
    .wave i{flex:1;height:12%;min-width:1px;border-radius:99px;background:rgba(210,206,199,.5);animation:wave var(--d) ease-in-out infinite alternate}
    .progress{display:grid;grid-template-columns:42px 1fr 42px;gap:9px;align-items:center;padding:4px 17px 10px;color:var(--text-ghost);font-size:9px;font-variant-numeric:tabular-nums}
    input[type=range]{width:100%;height:3px;appearance:none;background:rgba(230,228,224,.12);border-radius:99px;outline:none}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--bone);box-shadow:0 0 0 3px rgba(210,206,199,.08);cursor:pointer}
    input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--bone);cursor:pointer}
    .controls{display:grid;grid-template-columns:1fr 80px;gap:12px;padding:0 17px 15px}.vol{display:flex;align-items:center;gap:8px}.vol svg{width:13px;height:13px;stroke:var(--text-ghost);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .lyrics{padding:18px 17px 19px;border-top:1px solid rgba(230,228,224,.07);text-align:center;min-height:70px;display:grid;place-items:center}.lyric{color:rgba(230,228,224,.42);font:300 clamp(17px,3vw,22px)/1.28 var(--font-d);transition:opacity .25s ease}.lyric.active{color:var(--bone);animation:lyricIn .55s cubic-bezier(.16,1,.3,1)}

    .footer{margin-top:22px;text-align:center;color:rgba(230,228,224,.25);font-size:8px;letter-spacing:.35em;text-transform:uppercase}

    @media(max-width:520px){
      .hero{height:min(48vh,370px);min-height:220px}
      .hero-name{bottom:20%}
      .hero-name h1{font-size:clamp(38px,11vw,54px);letter-spacing:.15em}
      .tagline{font-size:9px;letter-spacing:.32em;margin-top:12px}
      .wrap{width:calc(100% - 24px);margin-top:-25px;padding-bottom:34px}
      .quote{margin-bottom:21px}
      .links a{min-height:64px;border-radius:16px;padding:0 15px 0 16px}
      .controls{grid-template-columns:1fr}.vol{display:none}
      .progress{grid-template-columns:38px 1fr 38px;padding-inline:14px}
      .player-top{padding:14px}.wave{padding-inline:14px}
      .lyrics{padding-inline:13px}
      .bg-hood{opacity:.56}
    }

    @media(pointer:coarse){.links a:hover{transform:none}.links a::after{display:none}.links a{transition:transform .25s ease}.links a:active{transform:scale(.985)}}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.links a{transform:none!important}}
  </style>
</head>

          <span class="link-main">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m21 4-3.2 16-5.1-4.1-3 2.9.3-4.6L18.5 7l-9.1 5.6-4.2-1.5z"/></svg>
            </span>
            <span class="link-copy"><small>02</small><strong>Telegram</strong></span>
          </span>
          <span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></span>
        </a>
      </nav>

      <section class="player" aria-label="Music player">
        <audio id="audio" preload="metadata" src="Every-Time.mp3"></audio>
        <div class="player-top">
          <button class="play" id="play" type="button" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13L19 12z"/></svg>
          </button>
          <div><div class="track-title">Every Time</div><div class="track-sub">Every Time · Benzola</div></div>
          <a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">Spotify ↗</a>
        </div>
        <div class="wave" id="wave"></div>
        <div class="progress"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek"/><span id="dur">0:00</span></div>
        <div class="controls"><div></div><label class="vol"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4z"/><path d="M17 9a5 5 0 0 1 0 6"/></svg><input id="volume" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="Volume"/></label></div>
        <div class="lyrics"><div class="lyric" id="lyric">…</div></div>
      </section>

      <div class="footer">† eternal</div>
    </section>
  </main>

  <script>
    const audio=document.getElementById('audio');
    const play=document.getElementById('play');
    const playIcon=document.getElementById('playIcon');
    const seek=document.getElementById('seek');
    const volume=document.getElementById('volume');
    const cur=document.getElementById('cur');
    const dur=document.getElementById('dur');
    const lyric=document.getElementById('lyric');
    const wave=document.getElementById('wave');

    for(let i=0;i<40;i++){
      const b=document.createElement('i');
      b.style.setProperty('--h',`${18+Math.random()*82}%`);
      b.style.setProperty('--d',`${.55+Math.random()*1.25}s`);
      b.style.animationDelay=`-${Math.random()*1.5}s`;
      wave.appendChild(b);
    }

    const parts=document.getElementById('parts');
    for(let i=0;i<18;i++){
      const p=document.createElement('i');
      p.style.left=`${Math.random()*100}%`;
      p.style.animationDuration=`${12+Math.random()*18}s`;
      p.style.animationDelay=`-${Math.random()*18}s`;
      p.style.opacity=(.12+Math.random()*.4).toFixed(2);
      p.style.transform=`scale(${.5+Math.random()*1.4})`;
      parts.appendChild(p);
    }

    const L=[
      {t:0,s:'…'},
      {t:3.9,s:'Мне крутит голову прокуренный быт'},
      {t:6.65,s:'Ком лезет из горла'},
      {t:8.2,s:'Я твой невроз, социальная травма'},
      {t:10.85,s:'Удары, порезы без повода'},
      {t:12.55,s:'Мутная грязь'},
      {t:14,s:'Среда обитания, нам с тобою комфортная'},
      {t:17.1,s:'Память насилует мозг'},
      {t:18.75,s:'Я снова даю дешёвое слово'},
      {t:21.35,s:'Мёртвое тело, сгнившее нутро'},
      {t:25.15,s:'Меня тащит на панельный или тащит на притон'},
      {t:29.55,s:'Я шагаю, шагаю, шагаю хуй пойми на чём'},
      {t:33.95,s:'Может быть, о лучшей жизни завтра мне приснится сон'},
      {t:38.7,s:'О, мой Бог курит боль и колется ночами'},
      {t:43.5,s:'Кремируй вечный покой, ведь счастье за горами'},
      {t:47.55,s:'Моя муза блюёт кровавыми кишками'},
      {t:52.45,s:'Я убит и разлагаюсь под твои печали'},
      {t:56.05,s:'О, мой Бог курит боль и колется ночами'},
      {t:61,s:'Кремируй вечный покой, ведь счастье за горами'},
      {t:64.95,s:'Моя муза блюёт кровавыми кишками'},
      {t:69.75,s:'Я убит и разлагаюсь под твои печали'},
      {t:74,s:'…'}
    ];

    let current=-1;
    const fmt=s=>{s=Math.max(0,s||0);const m=Math.floor(s/60);const sec=Math.floor(s%60).toString().padStart(2,'0');return `${m}:${sec}`};
    const lyricAt=t=>{let i=0;for(let n=0;n<L.length;n++)if(L[n].t<=t)i=n;return i};
    function show(i){if(i===current)return;current=i;lyric.classList.remove('active');void lyric.offsetWidth;lyric.textContent=L[i]?.s||'…';lyric.classList.add('active')}
    function setPlaying(on){playIcon.innerHTML=on?'<path d="M7 6h3v12H7zM14 6h3v12h-3z"/>':'<path d="M8 5.5v13L19 12z"/>';play.setAttribute('aria-label',on?'Pause':'Play')}

    play.addEventListener('click',()=>audio.paused?audio.play():audio.pause());
    audio.addEventListener('play',()=>setPlaying(true));
    audio.addEventListener('pause',()=>setPlaying(false));
    audio.addEventListener('loadedmetadata',()=>dur.textContent=fmt(audio.duration));
    audio.addEventListener('timeupdate',()=>{cur.textContent=fmt(audio.currentTime);if(audio.duration)seek.value=(audio.currentTime/audio.duration)*100;show(lyricAt(audio.currentTime))});
    audio.addEventListener('ended',()=>{setPlaying(false);show(0);seek.value=0});
    seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=(seek.value/100)*audio.duration});
    volume.addEventListener('input',()=>audio.volume=Number(volume.value));
    audio.volume=.85;
    show(0);

    /* Cursor-reactive glass tilt. It is deliberately tiny so the page
       stays elegant instead of looking like a game UI. */
    if(window.matchMedia('(pointer:fine)').matches){
      document.querySelectorAll('[data-tilt]').forEach(card=>{
        card.addEventListener('pointermove',e=>{
          const r=card.getBoundingClientRect();
          const x=(e.clientX-r.left)/r.width-.5;
          const y=(e.clientY-r.top)/r.height-.5;
          card.style.setProperty('--rx',`${x*5}deg`);
          card.style.setProperty('--ry',`${-y*5}deg`);
          card.style.setProperty('--mx',`${e.clientX-r.left}px`);
          card.style.setProperty('--my',`${e.clientY-r.top}px`);
        });
        card.addEventListener('pointerleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')});
        card.addEventListener('click',e=>{
          const r=card.getBoundingClientRect();
          const ripple=document.createElement('span');
          ripple.className='ripple';
          const size=Math.max(r.width,r.height)*.22;
          ripple.style.width=`${size}px`;ripple.style.height=`${size}px`;
          ripple.style.left=`${e.clientX-r.left-size/2}px`;ripple.style.top=`${e.clientY-r.top-size/2}px`;
          card.appendChild(ripple);setTimeout(()=>ripple.remove(),750);
        });
      });
    }

    /* Soft cursor light for the player. */
    const player=document.querySelector('.player');
    player.addEventListener('pointermove',e=>{const r=player.getBoundingClientRect();player.style.setProperty('--mx',`${e.clientX-r.left}px`);player.style.setProperty('--my',`${e.clientY-r.top}px`)});
  </script>
</body>
</html>
