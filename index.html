<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<meta name="color-scheme" content="dark">
<title>Benzola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#020202;--text:#e6e4e0;--ghost:#5c5954;--blood:#a81818;--bone:#d2cec7;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a,button,input{-webkit-tap-highlight-color:transparent}button{font:inherit}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes name{0%{opacity:0;letter-spacing:.4em;filter:blur(5px);transform:translateY(8px)}100%{opacity:1;letter-spacing:.2em;filter:none;transform:none}}
@keyframes wave{50%{height:var(--h)}}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000;pointer-events:none;contain:strict}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg-1{opacity:.68;filter:grayscale(1) contrast(1.14) brightness(.5)}
.bg-2{opacity:.18;filter:grayscale(1) brightness(.55)}
.bg-3,.bg-hood{display:none}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 42%,#000b 100%)}
.page{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;align-items:center}
.hero{position:relative;width:100%;height:min(39vh,350px);min-height:215px;isolation:isolate;overflow:hidden;background:#020202}
.hero-img{position:absolute;z-index:1;left:0;top:0;width:100%;height:128%;object-fit:cover;object-position:50% 0;filter:grayscale(.78) contrast(1.08) brightness(.72);mask-image:linear-gradient(to bottom,#000 0 42%,#000e 58%,#0009 76%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0 42%,#000e 58%,#0009 76%,transparent 100%);transition:transform .48s cubic-bezier(.16,1,.3,1);will-change:transform;transform-origin:50% 50%}
.hero:before{content:"";position:absolute;z-index:0;left:0;top:18%;width:100%;height:100%;background:url("fangs.webp") 50% 0/cover no-repeat;filter:grayscale(.8) brightness(.45) blur(18px);opacity:.24;mask-image:radial-gradient(ellipse 76% 70% at 50% 20%,#000 0 28%,#0008 55%,transparent 82%);-webkit-mask-image:radial-gradient(ellipse 76% 70% at 50% 20%,#000 0 28%,#0008 55%,transparent 82%);transition:transform .48s cubic-bezier(.16,1,.3,1);will-change:transform;transform-origin:50% 50%}
.hero:after{content:"";position:absolute;z-index:3;left:-20%;right:-20%;bottom:-30%;height:72%;background:linear-gradient(to bottom,transparent,#02020255 35%,#020202 82%);filter:blur(7px);pointer-events:none}
.hero-fade{position:absolute;z-index:4;inset:0;background:radial-gradient(ellipse 88% 76% at 50% 20%,transparent 22%,#0007 100%);pointer-events:none}
.hero-name{position:absolute;z-index:8;left:50%;bottom:15%;width:94%;transform:translateX(-50%);text-align:center;pointer-events:none}
.cross{display:block;color:var(--blood);font:300 24px/1 var(--serif)}
.hero-name h1{color:var(--bone);font:300 clamp(42px,8vw,76px)/.95 var(--serif);letter-spacing:.2em;animation:name 1s cubic-bezier(.16,1,.3,1) both;text-shadow:0 3px 25px #000}
.tagline{margin-top:11px;color:#ffffff9e;font-size:10px;letter-spacing:.36em;animation:fade .7s .25s both}
.wrap{position:relative;z-index:20;width:min(720px,calc(100% - 34px));margin-top:-24px;padding-bottom:48px}
.quote{text-align:center;margin-bottom:18px;color:#e6e4e0b8;font:italic 300 clamp(18px,3vw,24px)/1.3 var(--serif);text-shadow:0 2px 15px #000;animation:fade .6s .4s both}
.links{display:grid;gap:9px;margin-bottom:15px;max-height:139px;overflow:hidden;transition:max-height .38s ease,opacity .22s ease,transform .38s ease,margin .38s ease}
.links a{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 18px 0 20px;border:1px solid #e6e4e01c;border-radius:16px;color:var(--text);text-decoration:none;background:#ffffff07;box-shadow:0 10px 30px #0005;transition:transform .22s,border-color .22s;animation:fade .5s both}
.links a:nth-child(2){animation-delay:.05s}
.link-main{display:flex;align-items:center;gap:12px}.link-icon{width:32px;height:32px;display:grid;place-items:center;border:1px solid #e6e4e018;border-radius:9px;background:#ffffff08}.link-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.link-copy{display:flex;flex-direction:column;gap:3px}.link-copy small{color:var(--ghost);font-size:8px;letter-spacing:.3em}.link-copy strong{font-size:14px;letter-spacing:.06em;font-weight:500}.link-arrow{color:#e6e4e066;font-size:17px}
.player{position:relative;overflow:hidden;border:1px solid #e6e4e02a;border-radius:18px;background:rgba(18,18,18,.52);box-shadow:0 14px 48px #0007;transition:transform .42s cubic-bezier(.16,1,.3,1),border-radius .35s,box-shadow .35s;will-change:transform}
.player-top{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 16px 10px}.play{width:44px;height:44px;border:1px solid #e6e4e025;border-radius:13px;background:#ffffff08;color:var(--bone);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.play:active{transform:scale(.94)}.play svg{width:17px;height:17px;fill:currentColor}.track-title{font:400 18px/1 var(--serif)}.track-sub{margin-top:4px;color:var(--ghost);font-size:9px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spotify{color:#e6e4e066;text-decoration:none;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.wave{height:26px;display:flex;align-items:center;gap:2px;padding:0 16px}.wave i{flex:1;height:12%;border-radius:99px;background:#d2cec766;animation:none}.player.playing .wave i{animation:wave var(--d) ease-in-out infinite alternate}
.progress{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:3px 16px 8px;color:var(--ghost);font-size:9px}.controls{display:none}input[type=range]{width:100%;height:3px;appearance:none;background:#e6e4e01f;border-radius:99px;outline:0}input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--bone)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--bone)}
.lyrics{max-height:0;overflow:hidden;opacity:0;padding:0 18px;border-top:1px solid transparent;text-align:center;transition:max-height .38s ease,opacity .2s ease,padding .35s ease,border-color .2s ease}.lyric{color:var(--bone);font:300 clamp(22px,4vw,34px)/1.18 var(--serif);min-height:72px;display:grid;place-items:center}.lyric.active{animation:fade .2s}
body.is-playing .links{max-height:0;opacity:0;transform:translateY(-8px);margin:0;pointer-events:none}
body.is-playing .hero-img{transform:scale(.84,.72)}
body.is-playing .hero:before{transform:scale(.84,.72)}
.player.expanded{transform:translateY(-68px);border-radius:22px;box-shadow:0 22px 62px #0009}.player.expanded .lyrics{max-height:300px;opacity:1;padding:20px 18px 24px;border-color:#e6e4e012}.player.expanded .wave{height:34px}.player.expanded .lyric{font-size:clamp(25px,4.5vw,39px)}
@media(max-width:600px){
html,body{width:100%;overflow-x:hidden}.bg-1{opacity:.64;filter:grayscale(1) contrast(1.08) brightness(.46)}.bg-2{opacity:.10;filter:grayscale(1) brightness(.52)}
.hero{height:clamp(205px,31svh,255px);min-height:205px}.hero-img{height:124%;object-position:50% 0;filter:grayscale(.78) contrast(1.06) brightness(.7);mask-image:linear-gradient(to bottom,#000 0 36%,#000e 50%,#0009 66%,transparent 98%);-webkit-mask-image:linear-gradient(to bottom,#000 0 36%,#000e 50%,#0009 66%,transparent 98%)}.hero:before{top:18%;height:100%;background-position:50% 0;filter:grayscale(.8) brightness(.43) blur(14px);opacity:.2}.hero:after{filter:blur(5px);bottom:-34%;height:80%}.hero-name{bottom:11%;width:96%}.hero-name h1{font-size:clamp(38px,11vw,54px);letter-spacing:.14em}.cross{font-size:22px}.tagline{font-size:8px;letter-spacing:.27em;margin-top:8px}
.wrap{width:calc(100% - 16px);margin-top:-7px;padding-bottom:max(24px,env(safe-area-inset-bottom))}.quote{margin-bottom:9px;font-size:17px}.links{gap:6px;margin-bottom:7px;max-height:115px}.links a{min-height:51px;border-radius:12px;padding:0 12px 0 13px;box-shadow:0 7px 20px #0005}.link-main{gap:8px}.link-icon{width:27px;height:27px;border-radius:8px}.link-copy strong{font-size:11.5px}.link-copy small{font-size:6.5px}.link-arrow{font-size:13px}
.player{border-radius:15px;box-shadow:0 9px 28px #0007;background:rgba(18,18,18,.50)}.player-top{grid-template-columns:39px minmax(0,1fr) auto;gap:8px;padding:10px 11px 7px}.play{width:38px;height:38px;border-radius:10px}.track-title{font-size:15px}.track-sub{font-size:6.5px;letter-spacing:.08em}.spotify{font-size:6.5px;letter-spacing:.05em}.wave{height:17px;padding:0 11px;gap:1.5px}.progress{grid-template-columns:30px minmax(0,1fr) 30px;gap:5px;padding:2px 11px 7px;font-size:7px}.lyrics{padding-inline:5px}.player.expanded{transform:translateY(-74px);border-radius:18px;box-shadow:0 17px 48px #000a}.player.expanded .lyrics{max-height:315px;padding:17px 5px 20px}.player.expanded .wave{height:28px}.player.expanded .lyric{font-size:clamp(24px,7.1vw,34px);line-height:1.07;min-height:88px;padding:0 2px}
}
@media(pointer:coarse){.links a:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
body.tg-webview .bg-2{display:none}body.tg-webview .bg-1{filter:grayscale(1) brightness(.43)}body.tg-webview .player{background:rgba(8,8,8,.68)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img class="bg-1" src="dark-canopy.jpg"><img class="bg-2" src="mist-forest.jpg"></div>
<main class="page">
<header class="hero"><img class="hero-img" src="fangs.webp" alt=""><div class="hero-fade"></div><div class="hero-name"><span class="cross">†</span><h1>BENZOLA</h1><div class="tagline">fallen · beloved · eternal</div></div></header>
<section class="wrap"><p class="quote">вечность пахнет дымом и снегом</p>
<nav class="links">
<a href="https://www.tiktok.com/@kelli2458?_r=1&_t=ZG-99a2X7MxjEW" target="_blank" rel="noreferrer"><span class="link-main"><span class="link-icon"><svg viewBox="0 0 24 24"><path d="M14.4 4v9.2a4.1 4.1 0 1 1-3.1-4V6.1A7.2 7.2 0 1 0 17.5 4z"/><path d="M14.4 4c.5 2.2 1.8 3.6 4.1 4"/></svg></span><span class="link-copy"><small>01</small><strong>TikTok</strong></span></span><span class="link-arrow">↗</span></a>
<a href="https://t.me/Benzola_qq" target="_blank" rel="noreferrer"><span class="link-main"><span class="link-icon"><svg viewBox="0 0 24 24"><path d="m21 4-3.2 16-5.1-4.1-3 2.9.3-4.6L18.5 7l-9.1 5.6-4.2-1.5z"/></svg></span><span class="link-copy"><small>02</small><strong>Telegram</strong></span></span><span class="link-arrow">↗</span></a>
</nav>
<section class="player" id="player">
<audio id="audio" preload="metadata" playsinline src="Every-Time.mp3"></audio>
<div class="player-top"><button class="play" id="play" type="button" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13L19 12z"/></svg></button><div><div class="track-title">Every Time</div><div class="track-sub">Every Time · Benzola</div></div><a class="spotify" href="https://open.spotify.com/track/5QiOePTbj8ltnRdYShfz3E" target="_blank" rel="noreferrer">Spotify ↗</a></div>
<div class="wave" id="wave"></div>
<div class="progress"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step=".1"><span id="dur">0:00</span></div>
<div class="lyrics"><div class="lyric" id="lyric">…</div></div>
</section><div class="footer">† eternal</div></section></main>
<script>
(()=>{
const ua=navigator.userAgent||'',isTelegram=/Telegram/i.test(ua)||!!window.TelegramWebviewProxy;
if(isTelegram)document.body.classList.add('tg-webview');
const audio=document.getElementById('audio'),play=document.getElementById('play'),playIcon=document.getElementById('playIcon'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),lyric=document.getElementById('lyric'),player=document.getElementById('player'),wave=document.getElementById('wave');
const bars=isTelegram||matchMedia('(max-width:600px)').matches?14:22;
for(let i=0;i<bars;i++){const b=document.createElement('i');b.style.setProperty('--h',20+Math.random()*80+'%');b.style.setProperty('--d',1+Math.random()+'s');wave.appendChild(b)}
const L=[{t:0,s:'…'},{t:3.9,s:'Мне крутит голову прокуренный быт'},{t:6.65,s:'Ком лезет из горла'},{t:8.2,s:'Я твой невроз, социальная травма'},{t:10.85,s:'Удары, порезы без повода'},{t:12.55,s:'Мутная грязь'},{t:14,s:'Среда обитания, нам с тобою комфортная'},{t:17.1,s:'Память насилует мозг'},{t:18.75,s:'Я снова даю дешёвое слово'},{t:21.35,s:'Мёртвое тело, сгнившее нутро'},{t:25.15,s:'Меня тащит на панельный или тащит на притон'},{t:29.55,s:'Я шагаю, шагаю, шагаю хуй пойми на чём'},{t:33.95,s:'Может быть, о лучшей жизни завтра мне приснится сон'},{t:38.7,s:'О, мой Бог курит боль и колется ночами'},{t:43.5,s:'Кремируй вечный покой, ведь счастье за горами'},{t:47.55,s:'Моя муза блюёт кровавыми кишками'},{t:52.45,s:'Я убит и разлагаюсь под твои печали'},{t:56.05,s:'О, мой Бог курит боль и колется ночами'},{t:61,s:'Кремируй вечный покой, ведь счастье за горами'},{t:64.95,s:'Моя муза блюёт кровавыми кишками'},{t:69.75,s:'Я убит и разлагаюсь под твои печали'},{t:74,s:'…'}];
let current=-1,lastSecond=-1,tapLock=0;
const format=s=>Math.floor(Math.max(0,s||0)/60)+':'+(Math.floor(Math.max(0,s||0))%60).toString().padStart(2,'0');
function show(i){if(i===current)return;current=i;lyric.textContent=L[i]?.s||'…'}
function setPlaying(on){document.body.classList.toggle('is-playing',on);player.classList.toggle('expanded',on);player.classList.toggle('playing',on);playIcon.innerHTML=on?'<path d="M7 6h3v12H7zM14 6h3v12h-3z"/>':'<path d="M8 5.5v13L19 12z"/>';play.setAttribute('aria-label',on?'Pause':'Play')}
function togglePlay(e){if(e){e.preventDefault();e.stopPropagation()}const now=Date.now();if(now-tapLock<300)return;tapLock=now;if(audio.paused){const p=audio.play();if(p?.catch)p.catch(()=>{})}else audio.pause()}
play.addEventListener('pointerup',togglePlay,{passive:false});
play.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();togglePlay(e)}});
audio.addEventListener('play',()=>setPlaying(true));audio.addEventListener('pause',()=>setPlaying(false));audio.addEventListener('loadedmetadata',()=>dur.textContent=format(audio.duration));
audio.addEventListener('timeupdate',()=>{const sec=Math.floor(audio.currentTime);if(sec===lastSecond)return;lastSecond=sec;cur.textContent=format(audio.currentTime);if(audio.duration)seek.value=audio.currentTime/audio.duration*100;let i=0;for(let n=0;n<L.length;n++){if(L[n].t<=audio.currentTime)i=n;else break}show(i)});
audio.addEventListener('ended',()=>{setPlaying(false);seek.value=0;lastSecond=-1;show(0)});seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});show(0);
})();
</script>
</body>
