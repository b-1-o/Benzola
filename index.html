ight:0;overflow:hidden;opacity:0;padding:0 20px;border-top:1px solid transparent;text-align:center;transition:max-height .85s cubic-bezier(.16,1,.3,1),opacity .55s,padding .75s,border-color .6s}.lyric{color:var(--bone);font:300 clamp(22px,4vw,34px)/1.2 var(--serif);min-height:76px;display:grid;place-items:center}.lyric.active{animation:fade .5s}.footer{text-align:center;margin-top:22px;color:#e6e4e040;font-size:8px;letter-spacing:.35em;text-transform:uppercase}

<script>

play.onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>setPlaying(true);audio.onpause=()=>setPlaying(false);audio.onloadedmetadata=()=>dur.textContent=fmt(audio.duration);audio.ontimeupdate=()=>{cur.textContent=fmt(audio.currentTime);if(audio.duration)seek.value=audio.currentTime/audio.duration*100;let i=0;for(let n=0;n<L.length;n++)if(L[n].t<=audio.currentTime)i=n;show(i)};audio.onended=()=>{setPlaying(false);seek.value=0;show(0)};seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration};volume.oninput=()=>audio.volume=+volume.value;audio.volume=.85;show(0);
